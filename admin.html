<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Horizon Confess</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>*{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#0f0a0a] text-white min-h-screen p-4">
<div class="max-w-[1100px] mx-auto">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-[20px] font-bold">🔒 Admin Horizon Confess <span class="text-[10px] bg-yellow-400 text-black px-2 py-0.5 rounded-full">YTTA</span></h1>
    <div class="text-[11px] opacity-60" id="totalInfo">Loading...</div>
  </div>

  <div class="grid grid-cols-4 gap-2 mb-4">
    <div class="bg-white/10 rounded-xl p-3 text-center"><div class="text-[20px] font-bold" id="statTotal">0</div><div class="text-[9px] opacity-60">TOTAL</div></div>
    <div class="bg-white/10 rounded-xl p-3 text-center"><div class="text-[20px] font-bold" id="statToday">0</div><div class="text-[9px] opacity-60">HARI INI</div></div>
    <div class="bg-white/10 rounded-xl p-3 text-center"><div class="text-[20px] font-bold" id="statFoto">0</div><div class="text-[9px] opacity-60">PAKAI FOTO</div></div>
    <div class="bg-white/10 rounded-xl p-3 text-center"><div class="text-[20px] font-bold" id="statReport">0</div><div class="text-[9px] opacity-60">LV 3+</div></div>
  </div>

  <input id="searchAdmin" oninput="renderAdmin()" placeholder="🔍 Cari to / text / ip / badge / level..." class="w-full bg-white/10 border border-white/10 rounded-full px-4 py-2.5 text-[12px] mb-4 outline-none">

  <div id="adminList" class="grid gap-3"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCToBiaTsuCCWrDnKK8cI1aQf7BDHICsQ4", authDomain: "confess-f4711.firebaseapp.com", projectId: "confess-f4711", storageBucket: "confess-f4711.firebasestorage.app", messagingSenderId: "484779882136", appId: "1:484779882136:web:52ec1b393f5777e2b582ed" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "cnfss");
const colRef = collection(db, "confesses");

let allData = [];

window.deleteConfess = async function(id){
  if(!confirm('Yakin hapus confess ini?')) return;
  await deleteDoc(doc(db,"confesses",id));
}

window.renderAdmin = function(){
  let s = document.getElementById('searchAdmin').value.toLowerCase();
  let filtered = allData.filter(c => {
    let txt = `${c.to} ${c.text} ${c.sender?.ip} ${c.badge} ${c.level?.title}`.toLowerCase();
    return txt.includes(s);
  });

  document.getElementById('adminList').innerHTML = filtered.map(c => {
    let time = new Date(c.time).toLocaleString('id-ID');
    let lvl = c.level? `${c.level.icon} LV.${c.level.lv} ${c.level.title} (${c.xp||0} XP)` : 'No level';
    let badge = c.badge||'-';
    let sender = c.sender? `IP: ${c.sender.ip||'-'} | ${c.sender.ua?.slice(0,60)}` : 'No sender info';
    let foto = c.photo? `<img src="${c.photo}" class="w-full h-48 object-cover rounded-xl mt-2 border">` : '<div class="text-[10px] opacity-30 mt-2">No photo</div>';
    return `
    <div class="bg-white text-black rounded-[16px] p-4 border-2 ${c.photo?'border-yellow-400':''}">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full grid place-items-center text-[16px] border" style="background:${c.color||'#fff'}">${c.avatar||'🦊'}</div>
          <div>
            <div class="font-bold text-[12px]">To: ${c.to} | #${c.code} | ${c.cat}</div>
            <div class="text-[10px] opacity-60">${time} • ${c.replies?.length||0} reply • ${lvl} • ${badge}</div>
            <div class="text-[9px] opacity-50 mt-1">${sender}</div>
          </div>
        </div>
        <button onclick="deleteConfess('${c.firestoreId}')" class="bg-red-500 text-white px-3 py-1 rounded-full text-[10px] font-bold">HAPUS</button>
      </div>
      <div class="mt-3 text-[13px] leading-6 bg-[#f9f5f0] p-3 rounded-xl">${c.text}</div>
      ${foto}
      <div class="mt-2 flex gap-1 flex-wrap">${(c.tags||[]).map(t=>`<span class="text-[9px] bg-black text-white px-2 py-0.5 rounded-full">#${t}</span>`).join('')}</div>
      <div class="mt-2 text-[10px]">💖 ${c.reactions?.love||0} 😭 ${c.reactions?.cry||0} ☕ ${c.reactions?.coffee||0} 🫣 ${c.reactions?.shy||0}</div>
    </div>`
  }).join('');
}

onSnapshot(query(colRef, orderBy("createdAt","desc")), snap=>{
  allData = snap.docs.map(d=>({firestoreId:d.id,...d.data()}));
  document.getElementById('totalInfo').innerText = allData.length + ' confess';
  document.getElementById('statTotal').innerText = allData.length;
  document.getElementById('statToday').innerText = allData.filter(c=>Date.now()-c.time<86400000).length;
  document.getElementById('statFoto').innerText = allData.filter(c=>c.photo).length;
  document.getElementById('statReport').innerText = allData.filter(c=>(c.level?.lv||0)>=3).length;
  renderAdmin();
});
</script>
</body>
</html>
