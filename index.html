<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Confess BETA - anonimijon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#800020',maroon2:'#A11D33',broken:'#FFFBF5',cream:'#FFF2E2',gold:'#FFD166'}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif}
.masonry{column-count:1;column-gap:14px} @media(min-width:640px){.masonry{column-count:2}} @media(min-width:1024px){.masonry{column-count:3}}
.masonry-item{break-inside:avoid;margin-bottom:14px}
</style>
</head>
<body class="bg-broken text-[#2b1116] overflow-x-hidden">
<div id="landing" class="fixed inset-0 z-[100] bg-broken flex items-center justify-center p-4 transition-transform duration-700">
<div class="absolute inset-0 bg-gradient-to-br from-cream via-white to-broken"></div>
  <div class="relative z-10 w-full max-w-[420px]">
    <div class="bg-white border-[3px] border-maroon rounded-[28px] p-7 shadow-[0_20px_60px_rgba(128,0,32,0.16)] text-center">
      <div class="flex justify-center items-center gap-2 mb-2">
        <img src="logo.png" class="w-[84px] h-[84px] rounded-full border-[3px] border-maroon object-cover bg-white" onerror="this.style.display='none'">
        <div class="text-left leading-none">
          <div class="text-[10px] font-bold bg-maroon text-white px-2 py-1 rounded-full" id="timeBadge">KARAWANG</div>
          <div class="text-[11px] font-semibold mt-1 opacity-60" id="campusGreeting">Pagi!</div>
          <div class="text-[9px] opacity-40 mt-0.5" id="dateBadge">Loading...</div>
        </div>
      </div>
      <h1 class="text-[36px] font-extrabold leading-[0.9] text-maroon mt-3">Horizon<br><span class="text-maroon2">Confess</span> <span class="text-[12px] bg-gold text-maroon px-2 py-0.5 rounded-full">ONLINE</span></h1>
      <div class="mt-4 grid grid-cols-3 gap-2 text-center">
        <div class="bg-broken border border-cream rounded-xl py-2"><div class="font-extrabold text-maroon text-[16px]" id="lTotal">0</div><div class="text-[9px] font-semibold opacity-60">TOTAL</div></div>
        <div class="bg-maroon text-white rounded-xl py-2"><div class="font-extrabold text-[16px]" id="lToday">0</div><div class="text-[9px] opacity-80">HARI INI</div></div>
        <div class="bg-cream border border-maroon/20 rounded-xl py-2"><div class="font-extrabold text-maroon text-[16px]" id="liveDot">LIVE</div><div class="text-[9px] opacity-60">REALTIME</div></div>
      </div>
      <button onclick="enterApp()" class="w-full mt-4 bg-maroon text-white py-[14px] rounded-[14px] font-bold text-[14px]">Masuk sebagai anonimijon →</button>
      <div class="mt-3 text-[9px] opacity-40" id="connStatus">Menghubungkan...</div>
    </div>
  </div>
</div>
<div class="max-w-[1200px] mx-auto px-4 pb-28">
  <header class="sticky top-0 z-20 bg-broken/90 backdrop-blur-md border-b border-cream px-4 py-3 flex items-center justify-between -mx-4 mb-4">
    <div class="flex items-center gap-2 font-bold text-maroon">
      <img src="logo.png" class="w-9 h-9 rounded-full border-2 border-maroon object-cover bg-white" onerror="this.style.display='none'">
      <span class="leading-none text-[14px]">Horizon<br>Confess</span>
      <span class="text-[9px] bg-gold text-maroon px-2 py-0.5 rounded-full">ONLINE</span>
    </div>
    <div class="flex items-center gap-2">
      <input id="search" oninput="render()" placeholder="Cari #tag / gedung..." class="hidden md:block w-[300px] bg-white border-2 border-cream rounded-full px-4 py-2 text-[11px] outline-none focus:border-maroon">
      <div class="text-[10px] bg-white border border-cream rounded-full px-2.5 py-1 font-semibold">🔥 <span id="todayCount">0</span></div>
    </div>
  </header>
  <input id="searchM" oninput="document.getElementById('search').value=this.value; render()" placeholder="🔍 Cari gedung, #tag..." class="md:hidden w-full bg-white border-2 border-cream rounded-full px-4 py-2.5 text-[12px] mb-3">
  <div class="grid md:grid-cols-[1.2fr_0.8fr] gap-3 mb-4">
    <div class="bg-white border-2 border-maroon rounded-[18px] p-4">
      <div class="flex justify-between"><span class="font-bold text-[12px] text-maroon">🔥 Trending di Karawang</span><span class="text-[10px] opacity-40" id="greetingSmall">Pagi!</span></div>
      <div id="trending" class="mt-2 flex flex-wrap gap-1.5"></div>
      </div>
    <div class="bg-white border-2 border-maroon/20 rounded-[18px] p-4">
  <div class="flex justify-between items-center">
    <div class="font-bold text-[12px] text-maroon">🏆 Top Confess Minggu Ini</div>
    <div class="text-[9px] bg-gold px-2 py-0.5 rounded-full font-bold">HOT</div>
  </div>
  <div id="topConfessList" class="mt-3 flex flex-col gap-2">
    <div class="text-[11px] opacity-40">Loading...</div>
  </div>
</div>
   <div class="bg-white border-2 border-cream rounded-[18px] p-4">
      <div class="font-bold text-[12px]">Filter Gedung</div>
      <div class="mt-2 flex flex-wrap gap-1.5">
        <button onclick="quickFilter('Gedung B')" class="text-[10px] bg-broken border border-cream px-2.5 py-1 rounded-full">Gedung B</button>
        <button onclick="quickFilter('Kantin')" class="text-[10px] bg-broken border border-cream px-2.5 py-1 rounded-full">Kantin</button>
        <button onclick="quickFilter('Perpus')" class="text-[10px] bg-broken border border-cream px-2.5 py-1 rounded-full">Perpus</button>
        <button onclick="quickFilter('Parkiran')" class="text-[10px] bg-broken border border-cream px-2.5 py-1 rounded-full">Parkiran</button>
      </div>
      <div class="mt-2 text-[9px] opacity-40" id="headerDate">...</div>
    </div>
  </div>
  <div class="flex gap-2 overflow-auto pb-2">
    <button class="filter-btn active bg-maroon text-white border-2 border-maroon px-4 py-1.5 rounded-full text-[11px] font-semibold" onclick="setCat('all',this)">Semua</button>
    <button class="filter-btn bg-white border-2 border-maroon px-4 py-1.5 rounded-full text-[11px] font-semibold" onclick="setCat('Perasaan',this)">💘 Perasaan</button>
    <button class="filter-btn bg-white border-2 border-maroon px-4 py-1.5 rounded-full text-[11px] font-semibold" onclick="setCat('Curhat Dosen',this)">😤 Curhat Dosen</button>
    <button class="filter-btn bg-white border-2 border-maroon px-4 py-1.5 rounded-full text-[11px] font-semibold" onclick="setCat('Cari Teman',this)">🤝 Cari Teman</button>
    <button class="filter-btn bg-white border-2 border-maroon px-4 py-1.5 rounded-full text-[11px] font-semibold" onclick="setCat('Random',this)">🎉 Random</button>
  </div>
  <div id="feed" class="masonry mt-3"></div>
</div>
<button onclick="openCreate()" class="fixed bottom-6 right-6 z-30 bg-maroon text-white px-5 py-3.5 rounded-full font-bold text-[13px] shadow-[0_12px_30px_rgba(128,0,32,0.4)]">➕ Spill sebagai anonimijon</button>
<div id="createModal" class="fixed inset-0 z-[80] bg-[#2b1116]/35 backdrop-blur-md hidden place-items-center p-4">
  <div class="bg-broken border-[3px] border-maroon rounded-[22px] max-w-[460px] w-full p-5 relative max-h-[90vh] overflow-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-maroon text-[14px]">Spill anonimijon ONLINE</h3>
      <button onclick="closeCreate()" class="w-8 h-8 bg-white border-2 border-maroon rounded-full grid place-items-center font-bold text-maroon">✕</button>
    </div>
    <div class="space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-[11px] font-semibold">Untuk Siapa</label><input id="toInput" placeholder="Gedung B / Kantin" class="mt-1 w-full bg-white border-2 border-cream rounded-xl px-3 py-2.5 text-[12px]"></div>
        <div><label class="text-[11px] font-semibold">Kategori</label><select id="catInput" class="mt-1 w-full bg-white border-2 border-cream rounded-xl px-3 py-2.5 text-[12px]"><option>Perasaan</option><option>Curhat Dosen</option><option>Cari Teman</option><option>Random</option><option>Curhat Kuliah</option></select></div>
      </div>
      <div><label class="text-[11px] font-semibold">Pilih wujud anonimijon</label><div id="avatarPicker" class="mt-1 flex gap-1.5 overflow-auto"></div><div id="colorPicker" class="mt-2 flex gap-1.5"></div></div>
      <div><label class="text-[11px] font-semibold">Isi Confess <span id="charCount" class="opacity-50">0/500</span></label><textarea id="msgInput" maxlength="500" placeholder="To anak gedung B yang jaket maroon..." class="mt-1 w-full bg-white border-2 border-cream rounded-xl px-3 py-2.5 text-[12px] min-h-[110px] resize-none"></textarea></div>
      <button id="sendBtn" onclick="sendConfess()" class="w-full bg-maroon text-white py-3 rounded-xl font-bold text-[14px]">Kirim ONLINE ✈️</button>
    </div>
  </div>
</div>
<div id="detailModal" class="fixed inset-0 z-[90] bg-[#2b1116]/40 backdrop-blur-[18px] hidden place-items-center p-4">
  <div class="bg-broken border-[3px] border-maroon rounded-[24px] max-w-[560px] w-full shadow-[0_30px_90px_rgba(0,0,0,0.5)] relative max-h-[88vh] flex flex-col overflow-hidden">
    <div class="flex items-center justify-between p-4 border-b-2 border-cream bg-white">
      <div class="flex items-center gap-2"><div class="w-9 h-9 rounded-full border-2 border-maroon grid place-items-center text-[18px]" id="detailAvatar">🦊</div><div><div class="font-bold text-maroon text-[13px]" id="detailName">anonimijon #214</div><div class="text-[10px] opacity-50" id="detailTime">Baru saja</div></div></div>
      <button onclick="closeDetail()" class="w-9 h-9 bg-white border-2 border-maroon rounded-full grid place-items-center font-bold text-maroon">✕</button>
    </div>
    <div class="p-5 overflow-auto" id="detailContent"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyCToBiaTsuCCWrDnKK8cI1aQf7BDHICsQ4", authDomain: "confess-f4711.firebaseapp.com", projectId: "confess-f4711", storageBucket: "confess-f4711.firebasestorage.app", messagingSenderId: "484779882136", appId: "1:484779882136:web:52ec1b393f5777e2b582ed" };
const app = initializeApp(firebaseConfig);
const db = getFirestore("cnfss");
const colRef = collection(db, "confesses");
const avatars=['🦊','🐱','🐶','🐼','👻','🦄','🐙','🦝']; const colors=['#FFF2E2','#E0F2E9','#E0E7FF','#FFE4E6','#FEF3C7'];
let selectedAvatar=avatars[0]; let selectedColor=colors[0];
let confesses=[]; let activeCat='all'; let savedScroll=0;
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function parseContent(t){return esc(t).replace(/#(\w+)/g,'<span class="text-maroon2 font-bold">#$1</span>')}
function profanityFilter(t){const bad=['anjing','babi','tolol','goblok','kontol','memek']; let low=t.toLowerCase(); for(let w of bad){if(low.includes(w)) return true} return false;}
function getGreeting(){let h=new Date().getHours(); if(h<11) return 'Pagi, anak gedung B!'; if(h<14) return 'Siang, lagi di kantin ya?'; if(h<18) return 'Sore, perpus masih rame?'; return 'Malam, masih ngerjain tugas!';}
function updateDateTime(){
  let now = new Date(); let jam = now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}) + ' WIB';
  let tanggal = now.toLocaleDateString('id-ID',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  let t1=document.getElementById('timeBadge'); if(t1) t1.innerText=`KARAWANG • ${jam}`;
  let t2=document.getElementById('dateBadge'); if(t2) t2.innerText=tanggal;
  let t3=document.getElementById('headerDate'); if(t3) t3.innerText=tanggal;
  let g1=document.getElementById('campusGreeting'); if(g1) g1.innerText=getGreeting();
  let g2=document.getElementById('greetingSmall'); if(g2) g2.innerText=getGreeting();
}
updateDateTime(); setInterval(updateDateTime,60000);
window.enterApp=function(){document.getElementById('landing').style.transform='translateY(-100%)'; setTimeout(()=>document.getElementById('landing').style.display='none',600); render();}
function renderAvatarPicker(){
  document.getElementById('avatarPicker').innerHTML=avatars.map(a=>`<button type="button" onclick="window.pickAvatar('${a}')" class="w-9 h-9 rounded-full border-2 ${selectedAvatar===a?'border-maroon scale-110':'border-cream bg-white'} grid place-items-center text-[18px]" style="background:${selectedAvatar===a?selectedColor:'#fff'}">${a}</button>`).join('');
  document.getElementById('colorPicker').innerHTML=colors.map(c=>`<button type="button" onclick="window.pickColor('${c}')" class="w-7 h-7 rounded-full border-2 ${selectedColor===c?'border-maroon scale-110':'border-white'}" style="background:${c}"></button>`).join('');
}
window.pickAvatar=(a)=>{selectedAvatar=a; renderAvatarPicker();};
window.pickColor=(c)=>{selectedColor=c; renderAvatarPicker();};
renderAvatarPicker();
document.getElementById('msgInput').addEventListener('input',e=>{document.getElementById('charCount').innerText=e.target.value.length+'/500'})
function lockScroll(){savedScroll=window.scrollY; document.body.style.position='fixed'; document.body.style.top=`-${savedScroll}px`; document.body.style.width='100%';}
function unlockScroll(){document.body.style.position=''; document.body.style.top=''; document.body.style.width=''; window.scrollTo(0,savedScroll);}
window.openCreate=function(){lockScroll(); document.getElementById('createModal').classList.remove('hidden'); document.getElementById('createModal').classList.add('grid');}
window.closeCreate=function(){document.getElementById('createModal').classList.add('hidden'); document.getElementById('createModal').classList.remove('grid'); unlockScroll();}
window.sendConfess=async function(){
  let to=document.getElementById('toInput').value.trim(); let cat=document.getElementById('catInput').value; let text=document.getElementById('msgInput').value.trim();
  if(text.length<8){alert('Minimal 8 karakter');return} if(!to){alert('Isi Untuk Siapa');return}
  if(profanityFilter(text)||profanityFilter(to)){alert('Jaga etika kampus ya!');return}
  let tags=(text.match(/#(\w+)/g)||[]).map(t=>t.replace('#','')).slice(0,4);
  let btn=document.getElementById('sendBtn'); btn.disabled=true; btn.innerText='Mengirim ONLINE...';
  try{
    await addDoc(colRef, {to,cat,text,tags,avatar:selectedAvatar,color:selectedColor,time:Date.now(),createdAt:serverTimestamp(),code:Math.floor(100+Math.random()*900),reactions:{love:0,cry:0,coffee:0,shy:0},replies:[]});
    document.getElementById('msgInput').value=''; document.getElementById('toInput').value=''; document.getElementById('charCount').innerText='0/500'; closeCreate();
  }catch(e){alert('Gagal: '+e.message);}
  btn.disabled=false; btn.innerText='Kirim ONLINE ✈️';
}
window.setCat=function(cat,btn){activeCat=cat; document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('bg-maroon','text-white');b.classList.add('bg-white')}); btn.classList.add('bg-maroon','text-white'); btn.classList.remove('bg-white'); render();}
window.quickFilter=function(k){document.getElementById('search').value=k; document.getElementById('searchM').value=k; render();}
function getTrending(){let m={}; confesses.forEach(c=>(c.tags||[]).forEach(t=>{m[t]=(m[t]||0)+1})); return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,6);}
window.render=function(){
  let s=(document.getElementById('search')?.value||'').toLowerCase();
  let filtered=confesses.filter(c=>{let catOk=activeCat==='all'||c.cat===activeCat; let searchOk=!s||c.text.toLowerCase().includes(s)||c.to.toLowerCase().includes(s)||(c.tags||[]).join(' ').toLowerCase().includes(s); return catOk&&searchOk;});
  let tr=getTrending(); document.getElementById('trending').innerHTML=tr.map(([t,c])=>`<button onclick="quickFilter('${esc(t)}')" class="bg-white border border-maroon text-maroon px-3 py-1 rounded-full text-[11px] font-semibold">#${esc(t)} <span class="bg-maroon text-white ml-1 px-1.5 py-0.5 rounded-full text-[9px]">${c}</span></button>`).join('')||'<span class="text-[11px] opacity-40">Belum ada tag</span>';
  document.getElementById('feed').innerHTML=filtered.map(c=>{
    let total=Object.values(c.reactions||{}).reduce((a,b)=>a+b,0);
    let likedLove = localStorage.getItem(`liked_${c.firestoreId}_love`)? 'bg-cream border-maroon' : 'bg-broken border-cream';
    return `<div class="masonry-item bg-white border-[1.5px] border-cream hover:border-maroon rounded-[18px] p-4 shadow-sm">
      <div class="flex justify-between cursor-pointer" onclick="openDetail('${c.firestoreId}')"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full border-2 border-maroon grid place-items-center text-[16px]" style="background:${c.color}">${c.avatar}</div><div><div class="text-[10px] font-bold text-maroon">anonimijon ${c.avatar} #${c.code}</div><div class="text-[9px] opacity-50">${timeAgo(c.time)} • ${(c.replies||[]).length} balasan</div></div></div><span class="text-[9px] bg-cream px-2 py-1 rounded-full">${esc(c.cat)}</span></div>
      <div class="mt-3 cursor-pointer" onclick="openDetail('${c.firestoreId}')"><div class="text-[11px] font-semibold opacity-60">To: ${esc(c.to)}</div><div class="text-[13px] leading-6 mt-1 line-clamp-3">${parseContent(c.text)}</div></div>
      <div class="mt-2 flex flex-wrap gap-1">${(c.tags||[]).map(t=>`<span class="text-[10px] bg-broken border px-2 py-0.5 rounded-full">#${esc(t)}</span>`).join('')}</div>
      <div class="mt-3 flex items-center gap-1">
        <button onclick="react('${c.firestoreId}','love',this)" class="text-[10px] border px-2 py-1 rounded-full font-semibold transition-all ${likedLove}">💖 ${c.reactions?.love||0}</button>
        <button onclick="react('${c.firestoreId}','cry',this)" class="text-[10px] bg-broken border border-cream px-2 py-1 rounded-full">😭 ${c.reactions?.cry||0}</button>
        <span class="text-[10px] opacity-40 ml-auto">${total} reaksi • LIVE</span>
      </div>
    </div>`;
  }).join('')||`<div class="text-center py-12 opacity-50 text-[12px]">Belum ada confess, kamu yang pertama!</div>`;
  document.getElementById('todayCount').innerText=confesses.filter(c=>Date.now()-c.time<86400000).length;
  document.getElementById('lTotal').innerText=confesses.length;
  document.getElementById('lToday').innerText=confesses.filter(c=>Date.now()-c.time<86400000).length;
  function renderTopConfess(){
  const container = document.getElementById('topConfessList');
  if(!container) return;
  const top3 = [...confesses].sort((a,b)=>{
    const totalA = Object.values(a.reactions||{}).reduce((x,y)=>x+y,0);
    const totalB = Object.values(b.reactions||{}).reduce((x,y)=>x+y,0);
    return totalB-totalA;
  }).slice(0,3);
  container.innerHTML = top3.map((c,i)=>{
    const medal = i===0?'🥇':i===1?'🥈':'🥉';
    const total = Object.values(c.reactions||{}).reduce((x,y)=>x+y,0);
    return `<div onclick="openDetail('${c.firestoreId}')" class="cursor-pointer bg-broken border border-cream rounded-xl px-3 py-2.5 flex gap-2 items-center">
      <div class="text-[18px]">${medal}</div>
      <div class="flex-1"><div class="text-[11px] font-semibold line-clamp-1">${c.text.slice(0,40)}...</div><div class="text-[9px] opacity-50">💖 ${total} reaksi</div></div>
    </div>`;
  }).join('');
}
}
window.openDetail=function(fid){
  let c=confesses.find(x=>x.firestoreId===fid); if(!c) return; lockScroll();
  document.getElementById('detailAvatar').innerText=c.avatar; document.getElementById('detailAvatar').style.background=c.color;
  document.getElementById('detailName').innerText=`anonimijon ${c.avatar} #${c.code}`; document.getElementById('detailTime').innerText=`${timeAgo(c.time)} • ${esc(c.cat)} • To: ${esc(c.to)}`;
  document.getElementById('detailContent').innerHTML=`
    <div class="bg-white border-2 border-cream rounded-xl p-3"><div class="text-[11px] opacity-60">To: ${esc(c.to)}</div><div class="text-[14px] leading-7 mt-2">${parseContent(c.text)}</div><div class="mt-2 flex flex-wrap gap-1">${(c.tags||[]).map(t=>`<span class="text-[11px] bg-broken border px-2.5 py-1 rounded-full">#${esc(t)}</span>`).join('')}</div></div>
    <div class="mt-4 grid grid-cols-4 gap-2">${['love','cry','coffee','shy'].map(type=>{let emoji={love:'💖',cry:'😭',coffee:'☕',shy:'🫣'}[type]; let liked = localStorage.getItem(`liked_${c.firestoreId}_${type}`)? 'border-maroon bg-cream' : 'border-cream bg-white'; return `<button onclick="react('${c.firestoreId}','${type}',this)" class="py-2.5 rounded-xl border-2 font-bold text-[13px] transition-all ${liked}">${emoji} ${c.reactions?.[type]||0}</button>`}).join('')}</div>
    <div class="mt-5"><div class="font-bold text-[12px]">Thread (${(c.replies||[]).length})</div><div class="mt-2 grid gap-2 max-h-[160px] overflow-auto">${(c.replies||[]).map(r=>`<div class="flex gap-2"><div class="w-7 h-7 rounded-full border grid place-items-center text-[14px]" style="background:${r.color}">${r.avatar}</div><div class="bg-white border rounded-xl px-3 py-2 text-[12px] flex-1"><div class="font-bold text-[10px] text-maroon">${esc(r.name)}</div>${esc(r.text)}</div></div>`).join('')||'<div class="text-[11px] opacity-40">Belum ada balasan</div>'}</div>
    <div class="mt-3 flex gap-2"><input id="reply-${c.firestoreId}" placeholder="Balas..." class="flex-1 bg-white border-2 border-cream rounded-xl px-3 py-2.5 text-[12px]"><button onclick="addReply('${c.firestoreId}')" class="bg-maroon text-white px-4 rounded-xl font-bold text-[12px]">Kirim</button></div></div>
    <div class="mt-3"><button onclick="closeDetail()" class="w-full bg-cream border-2 rounded-xl py-2.5 text-[11px]">Tutup</button></div>`;
  document.getElementById('detailModal').classList.remove('hidden'); document.getElementById('detailModal').classList.add('grid');
}
window.closeDetail=function(){document.getElementById('detailModal').classList.add('hidden'); document.getElementById('detailModal').classList.remove('grid'); unlockScroll();}
window.react=async function(fid,type,el){
  let key = `liked_${fid}_${type}`;
  if(localStorage.getItem(key)){ el.animate([{transform:'scale(1)'},{transform:'scale(0.9)'},{transform:'scale(1)'}],{duration:200}); return; }
  let c=confesses.find(x=>x.firestoreId===fid); if(!c) return;
  let newCount = (c.reactions?.[type]||0) + 1;
  c.reactions[type]=newCount;
  el.innerHTML = el.innerHTML.replace(/\d+/, newCount);
  el.classList.add('border-maroon','bg-cream'); el.classList.remove('bg-broken','bg-white','border-cream');
  el.animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],{duration:250});
  localStorage.setItem(key, '1');
  try{ let newR={...(c.reactions||{})}; await updateDoc(doc(db,"confesses",fid), {reactions:newR}); }catch(e){ localStorage.removeItem(key); c.reactions[type]--; el.innerHTML = el.innerHTML.replace(/\d+/, c.reactions[type]); }
}
window.addReply=async function(fid){
  let inp=document.getElementById(`reply-${fid}`); let v=inp.value.trim(); if(v.length<2) return;
  let newReply={name:`anonimijon ${selectedAvatar} #${Math.floor(100+Math.random()*900)}`,text:v,avatar:selectedAvatar,color:selectedColor,time:Date.now()};
  await updateDoc(doc(db,"confesses",fid), {replies: arrayUnion(newReply)}); inp.value='';
}
function timeAgo(t){if(!t) return 'Baru saja'; let d=Math.floor((Date.now()-t)/60000);if(d<1)return'Baru saja';if(d<60)return d+' menit lalu';if(d<1440)return Math.floor(d/60)+' jam lalu';return Math.floor(d/1440)+' hari lalu';}
const q = query(colRef, orderBy("createdAt","desc"));
onSnapshot(q, (snap)=>{
  confesses = snap.docs.map(d=>({firestoreId:d.id,...d.data(), time:d.data().time||Date.now(), tags:d.data().tags||[], reactions:d.data().reactions||{love:0,cry:0,coffee:0,shy:0}, replies:d.data().replies||[] }));
  document.getElementById('connStatus').innerText='✅ LIVE - '+confesses.length+' confess';
  document.getElementById('liveDot').innerText='LIVE '+confesses.length;
  render();
}, (err)=>{document.getElementById('connStatus').innerText='❌ Error: '+err.message;});
render();
</script>
