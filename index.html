<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Confess ONLINE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{maroon:'#800020',maroon2:'#a00028',gold:'#FFD700',cream:'#FFF8DC',broken:'#FFF5E1'}}}}</script>
<style>
@keyframes floaty {0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
.floaty{animation:floaty 4s ease-in-out infinite}
@keyframes pulse-gold {0%{box-shadow:0 0 0 0 rgba(255,215,0,0.7)}70%{box-shadow:0 0 0 8px rgba(255,215,0,0)}100%{box-shadow:0 0 0 0 rgba(255,215,0,0)}}
.ring-gold{animation:pulse-gold 1s ease}
</style>
</head>
<body class="bg-[#FFF5E1] min-h-screen">

<!-- LANDING - UDAH RAME -->
<div id="landing" class="fixed inset-0 z-[100] flex items-center justify-center p-4 transition-transform duration-700 overflow-hidden bg-[#FFF5E1]">
  <div class="absolute inset-0 bg-gradient-to-br from-cream via-white to-broken"></div>
  <div class="absolute -top-20 -left-20 w-[300px] h-[300px] bg-maroon/10 rounded-full blur-[60px]"></div>
  <div class="absolute -bottom-20 -right-20 w-[400px] h-[400px] bg-gold/20 rounded-full blur-[70px]"></div>
  <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#800020 1.5px, transparent 1.5px); background-size: 24px 24px;"></div>
  <div class="absolute top-[15%] left-[10%] text-[30px] opacity-20 floaty" style="--r:-15deg">💌</div>
  <div class="absolute top-[20%] right-[12%] text-[24px] opacity-20 floaty" style="--r:15deg; animation-delay:.5s">🫣</div>
  <div class="absolute bottom-[18%] left-[15%] text-[26px] opacity-20 floaty" style="--r:10deg; animation-delay:1s">💖</div>
  <div class="absolute bottom-[25%] right-[10%] text-[28px] opacity-20 floaty" style="--r:-10deg; animation-delay:1.5s">🦊</div>

  <div class="relative z-10 w-full max-w-[420px]">
    <div class="bg-white border-[3px] border-maroon rounded-[28px] p-7 shadow-[0_20px_60px_rgba(128,0,32,0.16)] text-center">
      <div class="flex justify-center items-center gap-2 mb-2">
        <img src="logo.png" class="w-[84px] h-[84px] rounded-full border-[3px] border-maroon object-cover bg-white" onerror="this.style.display='none'">
        <div class="text-left leading-none">
          <div class="text-[10px] font-bold bg-maroon text-white px-2 py-1 rounded-full">KARAWANG</div>
          <div class="text-[11px] font-semibold mt-1 opacity-60">Halo Cemuanya 😘</div>
          <div class="text-[9px] opacity-40 mt-0.5" id="connStatus">Menghubungkan...</div>
        </div>
      </div>
      <h1 class="text-[36px] font-extrabold leading-[0.9] text-maroon mt-3">Horizon<br><span class="text-maroon2">Confess</span> <span class="text-[12px] bg-gold text-maroon px-2 py-0.5 rounded-full">ONLINE</span></h1>
      <div class="mt-4 bg-broken border-2 border-cream rounded-[16px] py-4">
        <div class="font-extrabold text-maroon text-[32px] leading-none" id="lTotal">0</div>
        <div class="text-[10px] font-bold opacity-60 tracking-widest mt-1">TOTAL CONFESS</div>
      </div>
      <button onclick="enterApp()" class="w-full mt-4 bg-maroon text-white py-[14px] rounded-[14px] font-bold text-[14px] hover:bg-maroon2 active:scale-[0.96] transition-all">Masuk sebagai anonimijon →</button>
      <div class="mt-3 text-[9px] opacity-40">anonim • aman • realtime</div>
    </div>
    <div class="text-center mt-3 text-[10px] opacity-30">anonim • aman • realtime • Karawang</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="max-w-[480px] mx-auto p-4 pt-6 hidden">
  <div class="bg-white border-[3px] border-maroon rounded-[20px] p-4">
    <textarea id="confessInput" placeholder="mau curcol apa lagi hari ini?" class="w-full bg-broken border-[2px] border-cream rounded-[14px] p-4 text-[14px] focus:border-gold focus:outline-none transition-colors resize-none h-[100px]"></textarea>
    <button onclick="kirimConfess()" class="w-full mt-3 bg-maroon text-white py-[12px] rounded-[12px] font-bold text-[14px] hover:bg-maroon2 active:scale-[0.97] transition-all">Kirim Curhat 💌</button>
  </div>
  <div id="confessList" class="flex flex-col gap-4 mt-5"></div>
</div>

<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-maroon text-white px-5 py-3 rounded-full text-[13px] font-bold shadow-lg translate-y-[150px] opacity-0 transition-all duration-300 z-[200]">Confess kamu udah terkirim! ✨</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// GANTI INI PAKE CONFIG BEBEN!
const firebaseConfig = {
  apiKey: "API_KEY_BEBEN",
  authDomain: "horizon-confess.firebaseapp.com",
  projectId: "horizon-confess",
  storageBucket: "horizon-confess.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:xxxx"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const confessCol = collection(db, "confesses");

// PERATURAN
const toxicWords = ["anjing","bangsat","tolol","goblok","kontol","memek","babi","ngentot","jembut"];
const isToxic = (t) => toxicWords.some(w=> t.toLowerCase().includes(w));

let lastPostTime = parseInt(localStorage.getItem('horizon_last')||'0');
function canPost(){
  const now = Date.now();
  const diff = now - lastPostTime;
  if(diff < 300000){
    const sisa = Math.ceil((300000-diff)/1000);
    const m = Math.floor(sisa/60);
    const d = sisa%60;
    alert(`Sabar ya kawan, ${m}:${d.toString().padStart(2,'0')} lagi baru bisa curhat lagi 🥺`);
    return false;
  }
  return true;
}

function showSkeleton(){
  document.getElementById('confessList').innerHTML=`
    <div class="bg-white border-2 border-cream rounded-[16px] p-4 animate-pulse"><div class="h-4 bg-[#FFF5E1] rounded w-3/4 mb-2"></div><div class="h-4 bg-[#FFF5E1] rounded w-1/2"></div></div>
    <div class="bg-white border-2 border-cream rounded-[16px] p-4 animate-pulse"><div class="h-4 bg-[#FFF5E1] rounded w-2/3 mb-2"></div><div class="h-4 bg-[#FFF5E1] rounded w-3/4"></div></div>`;
}

window.enterApp = () => {
  document.getElementById('landing').style.transform='translateY(-100%)';
  document.getElementById('app').classList.remove('hidden');
}

function showToast(){
  const t=document.getElementById('toast');
  t.classList.remove('translate-y-[150px]','opacity-0');
  t.classList.add('translate-y-0','opacity-100');
  setTimeout(()=>{ t.classList.add('translate-y-[150px]','opacity-0'); t.classList.remove('translate-y-0','opacity-100'); },2500);
}

window.kirimConfess = async () => {
  const input=document.getElementById('confessInput');
  const text=input.value.trim();
  if(!text) return;
  if(isToxic(text)){ alert("aduh gabole gitu dong ngetiknya, jempolnya di jaga yaa"); return; }
  if(!canPost()) return;

  await addDoc(confessCol, { text, time: Date.now() });
  lastPostTime=Date.now();
  localStorage.setItem('horizon_last', lastPostTime.toString());
  input.value="";
  showToast();
  setTimeout(()=>{
    window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
    const first=document.getElementById('confessList').firstElementChild;
    if(first){ first.classList.add('ring-2','ring-gold'); setTimeout(()=> first.classList.remove('ring-2','ring-gold'),1000); }
  },600);
}

// REALTIME LISTENER
showSkeleton();
const q = query(confessCol, orderBy("time","asc"));
onSnapshot(q, (snap)=>{
  const list=document.getElementById('confessList');
  document.getElementById('lTotal').innerText = snap.size;
  document.getElementById('connStatus').innerText = "Terhubung • Realtime ON";
  if(snap.empty){ list.innerHTML='<div class="text-center opacity-40 text-[13px] py-10">Belum ada curhatan, jadi yang pertama yuk!</div>'; return; }
  list.innerHTML = snap.docs.slice().reverse().map(d=>{
    const c=d.data();
    return `<div class="bg-white border-[2px] border-cream rounded-[16px] p-4 shadow-sm leading-[1.6]"><div class="text-[13px]">${c.text}</div><div class="text-[10px] opacity-40 mt-2">${new Date(c.time).toLocaleTimeString('id-ID')} • anonim</div></div>`
  }).join('');
});
</script>
</body>
</html>
