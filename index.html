<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalem Guys...</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Playfair+Display:wght@800&display=swap" rel="stylesheet">
<style>
:root{--maroon:#7A1020;--dark:#4E0A14;--broken:#FFFBF5;--line:#E9DCCF}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(800px 400px at 50% 0%, #FFFBF5 0%, #FFF2E2 100%);font-family:'Inter',sans-serif;padding:20px;color:var(--maroon)}
.card{width:100%;max-width:380px;background:#fff;border:1.5px solid var(--line);border-radius:28px;padding:28px 24px;text-align:center;box-shadow:0 20px 60px rgba(122,16,32,0.12);position:relative;overflow:hidden}

/* ANIMASI MATA NGANTUK */
.sleepy{width:90px;height:64px;margin:0 auto 14px;position:relative}
.face{width:100%;height:100%;background:var(--broken);border:2px solid var(--maroon);border-radius:20px;display:flex;align-items:center;justify-content:center;gap:18px;position:relative}
.eye{width:14px;height:14px;background:var(--maroon);border-radius:50%;position:relative;animation:blink 3s infinite}
.eye::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:3px;background:var(--maroon);border-radius:2px}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}92%,94%{transform:scaleY(0.1)}}
.mouth{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:18px;height:8px;border-bottom:2.5px solid var(--maroon);border-radius:0 0 10px 10px;animation:yawn 2.5s ease-in-out infinite}
@keyframes yawn{0%,100%{height:8px}50%{height:14px;width:14px}}
.zzz{position:absolute;top:-8px;right:-10px;font-size:14px;font-weight:800;animation:floatZ 2s ease-in-out infinite}
.zzz:nth-child(2){right:-22px;top:-18px;animation-delay:0.3s;font-size:11px}
.zzz:nth-child(3){right:-2px;top:-24px;animation-delay:0.6s;font-size:10px;opacity:0.7}
@keyframes floatZ{0%,100%{transform:translateY(0) rotate(-10deg);opacity:0.8}50%{transform:translateY(-8px) rotate(5deg);opacity:1}}

/* KOPI TUMPAH */
.coffee-wrap{margin:14px auto 0;width:54px;height:54px;position:relative;animation:shakeCup 2.2s ease-in-out infinite}
@keyframes shakeCup{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.cup{width:54px;height:38px;background:#fff;border:2px solid var(--maroon);border-bottom-width:3px;border-radius:0 0 14px 14px;position:relative;overflow:hidden}
.cup::before{content:'';position:absolute;top:6px;left:4px;right:4px;height:14px;background:var(--maroon);border-radius:0 0 8px 8px;opacity:0.9}
.handle{position:absolute;right:-12px;top:8px;width:14px;height:18px;border:2.5px solid var(--maroon);border-left:none;border-radius:0 8px 8px 0}
.steam{position:absolute;top:-14px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.steam span{width:3px;height:14px;background:rgba(122,16,32,0.2);border-radius:2px;animation:steamUp 1.5s infinite}
.steam span:nth-child(2){animation-delay:0.2s}
.steam span:nth-child(3){animation-delay:0.4s}
@keyframes steamUp{0%{transform:translateY(0) scaleY(1);opacity:0.3}100%{transform:translateY(-14px) scaleY(1.3);opacity:0}}
.spill{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:68px;height:8px;background:var(--maroon);border-radius:50%;opacity:0.15;filter:blur(1px);animation:spillGrow 2.2s infinite}
@keyframes spillGrow{0%,100%{width:68px}50%{width:80px}}

.badge{display:inline-block;background:var(--broken);border:1px solid var(--line);color:var(--maroon);font-size:9px;font-weight:800;letter-spacing:1.5px;padding:6px 12px;border-radius:999px;margin:16px 0}
h1{font-family:'Playfair Display',serif;font-size:30px;line-height:1.05;font-weight:800}
h1 span{font-weight:400;font-style:italic}
p{font-size:14px;line-height:1.6;color:#6B5A5A;margin:16px 0 0}
p b{color:var(--maroon)}
.divider{width:32px;height:3px;background:var(--maroon);margin:18px auto;border-radius:2px}
.btn{width:100%;padding:14px;background:var(--maroon);color:#fff;border:none;border-radius:12px;font-weight:700;font-size:13px;margin-top:20px;cursor:pointer}
.btn:active{transform:scale(0.97)}
.small{font-size:10px;color:#9A8A8A;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <div class="sleepy">
    <div class="face">
      <div class="eye"></div>
      <div class="eye"></div>
      <div class="mouth"></div>
    </div>
    <div class="zzz">Z</div>
    <div class="zzz">Z</div>
    <div class="zzz">z</div>
  </div>

  <div class="coffee-wrap">
    <div class="steam"><span></span><span></span><span></span></div>
    <div class="cup"></div>
    <div class="handle"></div>
    <div class="spill"></div>
  </div>

  <div class="badge">HORIZON CONFESS • BETA</div>
  <h1>Kalem guys,<br><span>masih soon.</span></h1>
  <div class="divider"></div>
  <p>
    Sumpah <b>beben cape bikinnya</b> 😮‍💨<br>
    Ngoding dari jam 2 malem, kopinya sampe tumpah-tumpah, matanya udah 5 watt.<br><br>
    Tapi tenang, <b>100% jadi kok.</b> Lagi kita beresin biar gak bug lagi.
  </p>
  <button class="btn" onclick="if(navigator.vibrate)navigator.vibrate([30,20,60]); location.href='home.html'">Yaudah gapapa beb, masuk aja →</button>
  <div class="small">© 2026 HC • Made with love + begadang + kopi tumpah</div>
</div>
</body>
</html>
