 <!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Confess</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:#fcf9ff}
.top{position:sticky;top:0;background:#fcf9ffe6;backdrop-filter:blur(12px);border-bottom:1px solid #eee;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{width:40px;height:40px;border-radius:50%;background:linear-gradient(#ff8fa3,#b06cff);display:grid;place-items:center;color:#fff;font-weight:800}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.hero{text-align:center;padding:18px 10px}.hero h1{font-size:28px;line-height:1.1}.hero h1 span{background:linear-gradient(90deg,#ff5a8a,#8a5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;border:1px solid #f0e6ff;border-radius:20px;padding:16px;margin-top:12px}
textarea{width:100%;border:2px solid #efe6ff;background:#fbf7ff;border-radius:14px;padding:12px;min-height:100px;outline:none}
.tag{display:inline-block;padding:8px 14px;border-radius:99px;background:#f3e8ff;margin:4px;font-size:13px;font-weight:700;cursor:pointer}.tag.on{background:#111;color:#fff}
.inp{width:100%;margin-top:10px;border:2px solid #efe6ff;background:#fbf7ff;border-radius:10px;padding:10px 12px}
.btn{width:100%;margin-top:12px;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:800}
.item{background:#fff;border:1px solid #f0e8ff;border-radius:18px;padding:14px;margin-bottom:10px}
</style>
</head>
<body>
<div class="top"><div style="display:flex;gap:8px;align-items:center"><div class="logo">H</div><b>HORIZON CONFESS</b></div><div style="background:#111;color:#fff;padding:6px 10px;border-radius:99px;font-size:11px"><span id="cnt">0</span> LIVE</div></div>
<div class="wrap">
<div class="hero"><h1>Curhat Anonim<br><span>Langsung Muncul</span></h1><p style="color:#888;font-size:13px;margin-top:6px">100% anonim • Realtime</p></div>
<div class="card">
<textarea id="txt" placeholder="Tulis curhatan lu..."></textarea>
<div style="margin-top:10px"><div class="tag on" data-t="crush">👀 Crush</div><div class="tag" data-t="galau">💔 Galau</div><div class="tag" data-t="bucin">😍 Bucin</div><div class="tag" data-t="roasting">🔥 Roasting</div><div class="tag" data-t="random">🤣 Random</div></div>
<input id="to" class="inp" placeholder="Untuk siapa? (boleh kosong)">
<button class="btn" onclick="kirim()">🚀 KIRIM</button>
<p id="st" style="text-align:center;font-size:11px;color:#888;margin-top:8px">Menghubungkan...</p>
</div>
<div id="feed" style="margin-top:14px"></div>
</div>
<script>
let curTag='crush';let data=[];
const API="https://api.npoint.io/42d5e8f9b1c0a7d6e9f2";
document.querySelectorAll('.tag').forEach(el=>el.onclick=()=>{document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));el.classList.add('on');curTag=el.dataset.t;});
async function load(){
 try{
  let r=await fetch(API);let j=await r.json();data=j.data||j.confess||[];
  document.getElementById('cnt').innerText=data.length;
  document.getElementById('st').innerText='🟢 Live - '+data.length+' confess';
  render();
 }catch(e){
  // bikin database pertama kali
  await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:[{t:'Buat cewe hoodie item di kantin teknik, lu cantik bgt 😭',tag:'crush',to:'Kantin Teknik',time:'baru saja'}]})});
  load();
 }
}
function render(){
 let f=document.getElementById('feed');f.innerHTML='';
 [...data].reverse().forEach(d=>{
  f.innerHTML+=`<div class="item"><b style="font-size:11px;background:#f2efff;color:#7a5cff;padding:4px 8px;border-radius:99px">#${d.tag}</b><span style="float:right;font-size:11px;color:#aaa">${d.time}</span><div style="font-size:12px;color:#777;margin-top:6px">Untuk: <b>${d.to}</b></div><div style="margin-top:8px;font-size:15px;line-height:1.5">${d.t}</div></div>`;
 });
}
async function kirim(){
 let t=document.getElementById('txt').value.trim();let to=document.getElementById('to').value.trim()||'Semua Orang';
 if(t.length<4)return alert('Tulis dulu!');
 let r=await fetch(API);let j=await r.json();let arr=j.data||j.confess||[];
 arr.push({t:t,tag:curTag,to:to,time:'baru saja'});
 await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:arr})});
 document.getElementById('txt').value='';load();
}
load();setInterval(load,3000);
</script>
</body>
</html>
