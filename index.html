<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MANCING GOT ULTIMATE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box} body{background:#050510;display:grid;place-items:center;min-height:100vh;font-family:'Press Start 2P',monospace;color:#fff;padding:8px}
.g{width:100%;max-width:420px;background:#1a1a2e;border:4px solid #000;box-shadow:0 0 0 4px #ffffff11;overflow:hidden}
.top{padding:8px;background:#2a2a4a;border-bottom:4px solid #000;display:flex;justify-content:space-between;font-size:6px}
canvas{width:100%;aspect-ratio:4/4.6;display:block;image-rendering:pixelated;cursor:pointer}
.bars{padding:6px;background:#111;display:none}
.bar{height:16px;background:#222;border:2px solid #000;position:relative;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#f00,#ff0,#0f0)}
.zone{position:absolute;top:0;bottom:0;left:40%;right:40%;border-left:2px dashed #fff;border-right:2px dashed #fff;background:#ffffff11}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:6px;background:#222232}
.b{padding:10px 4px;border:3px solid #000;color:#fff;font-family:'Press Start 2P',monospace;font-size:6px;cursor:pointer}
.b:active{transform:translateY(1px)}.gbtn{background:#4CAF50}.ybtn{background:#ffcc00;color:#000}.rbtn{background:#ff4444}.blbtn{background:#4488ff}
.shop{padding:8px;background:#0a0a1a;border-top:4px solid #000;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.s{padding:6px;background:#2a2a3a;border:2px solid #000;font-size:5px;line-height:1.4}
.s b{color:#ffcc00}.s button{margin-top:4px;width:100%;padding:5px;font-size:5px;font-family:'Press Start 2P',monospace;border:2px solid #000;background:#4CAF50;color:#fff;cursor:pointer}
.s button:disabled{background:#555}
.log{padding:6px;font-size:5px;background:#000;color:#8f8;text-align:center;min-height:18px}
.inv{display:flex;gap:3px;padding:6px;background:#0a0a14;flex-wrap:wrap;min-height:28px;font-size:5px}
.f{padding:3px 5px;background:#333;border:2px solid #000}
</style>
</head>
<body>
<div class="g">
<div class="top"><div>🎣 GOT BEKASI v2 ULTIMATE</div><div>💰<span id="money">0</span> | Lv<span id="lvl">1</span></div></div>
<canvas id="c" width="320" height="368"></canvas>
<div class="bars" id="bars"><div style="display:flex;justify-content:space-between;font-size:5px;margin-bottom:2px"><span id="fishName">-</span><span id="powerTxt">0%</span></div><div class="bar"><div class="fill" id="fill"></div><div class="zone"></div></div><div style="font-size:4px;color:#aaa;margin-top:2px">TAP TERUS PAS DI ZONA KUNING!</div></div>
<div class="btns">
<button class="b gbtn" id="castBtn">🎣 LEMPAR</button>
<button class="b ybtn" id="sellBtn">💰 JUAL (Rp<span id="sellVal">0</span>)</button>
<button class="b blbtn" id="baitBtn">🪱 UMPAN: <span id="baitName">Cacing</span></button>
<button class="b rbtn" id="bossBtn" disabled>🐊 BOSS GOT (Rp50k)</button>
</div>
<div class="log" id="log">Beben, lempar pancing! Cari Lele Raksasa!</div>
<div class="inv" id="inv"></div>
<div class="shop">
<div class="s"><b>🎣 PANCING</b><br><span id="rodName">Bambu Bekas</span><br>Speed: <span id="rodSpeed">1x</span><br><button id="upRod">UPGRADE Rp15k</button></div>
<div class="s"><b>🪱 UMPAN</b><br>Cacing → Pelet → Jangkrik → Daging<br><button id="upBait">BELI UMPAN Rp5k</button></div>
<div class="s"><b>💡 SENTER</b><br>Mancing malem dapet ikan hantu<br><span id="lightStatus">OFF</span><br><button id="upLight">BELI Rp20k</button></div>
<div class="s"><b>📦 KAPASITAS</b><br>Tas: <span id="bag">5</span> ikan<br><button id="upBag">UPGRADE Rp10k</button></div>
</div>
</div>
<script>
let canvas=document.getElementById('c'), ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
let state='idle', money=5000, inv=[], rodLv=1, baitLv=1, hasLight=false, bagSize=5, bossReady=false, totalFish=0;
let currentFish=null, reelPower=0, reelDir=1, reelInterval=null, time=0.3;

let rods=[{name:'Bambu Bekas',speed:1,price:0},{name:'Bambu Carbon',speed:1.5,price:15000},{name:'Pancing Fiber',speed:2.2,price:35000},{name:'Pancing Sultan Shimano',speed:3,price:70000}];
let baits=['Cacing','Pelet Wangi','Jangkrik Hidup','Daging Ayam Busuk'];
let fishTypes=[
 {name:'Lele Got',emoji:'🐟',price:3000,rare:0.35,color:'#5a5a5a',power:20},
 {name:'Nila Got',emoji:'🐠',price:6000,rare:0.25,color:'#ff8c42',power:30},
 {name:'Gabus Got',emoji:'🐡',price:10000,rare:0.15,color:'#2a5a2a',power:40},
 {name:'Sendal',emoji:'🩴',price:300,rare:0.1,color:'#f00',power:10,trash:true},
 {name:'Lele Raksasa',emoji:'🐋',price:25000,rare:0.08,color:'#111',power:60,legend:true},
 {name:'Lele Hantu Malem',emoji:'👻',price:40000,rare:0.04,color:'#aaf',power:80,legend:true,nightOnly:true},
 {name:'Koin Emas Got',emoji:'💰',price:15000,rare:0.03,color:'#ff0',power:5},
];
let bossFish={name:'BUAYA GOT BANTAR GEBANG',emoji:'🐊',price:100000,rare:1,color:'#0a3a0a',power:100,boss:true};

function draw(){
 let isNight=time>0.7||time<0.2;
 let grad=ctx.createLinearGradient(0,0,0,368);
 if(!isNight){ grad.addColorStop(0,'#87CEEB'); grad.addColorStop(0.35,'#5a7a4a'); } else { grad.addColorStop(0,'#0a0a2a'); grad.addColorStop(0.35,'#1a2a1a'); }
 grad.addColorStop(1,'#0a1a0a'); ctx.fillStyle=grad; ctx.fillRect(0,0,320,368);
 ctx.fillStyle=isNight?'#0a0a2a':'#87CEEB'; ctx.fillRect(0,0,320,110);
 if(!isNight){ ctx.fillStyle='#fff'; ctx.fillRect(30,20,30,8); ctx.fillRect(180,15,40,10); } else { ctx.fillStyle='#ffffff88'; for(let i=0;i<12;i++) ctx.fillRect((i*53)%300,10+(i*17)%40,2,2); ctx.fillStyle='#ffffaa'; ctx.beginPath(); ctx.arc(260,25,12,0,Math.PI*2); ctx.fill(); }
 ctx.fillStyle='#4a3728'; ctx.fillRect(0,70,320,50);
 ctx.fillStyle='#2a2a3a'; ctx.fillRect(10,75,50,20); ctx.fillRect(80,65,60,30);
 ctx.fillStyle='#000'; for(let i=0;i<4;i++) ctx.fillRect(18+i*10,85,5,6);
 // got
 ctx.fillStyle='#1a2e1a'; ctx.fillRect(0,120,320,248);
 ctx.fillStyle='#0a1f0a'; ctx.globalAlpha=0.9; ctx.fillRect(0,135,320,233); ctx.globalAlpha=1;
 // air animation
 ctx.fillStyle='#ffffff08'; for(let i=0;i<5;i++){ let x=(i*70+Date.now()*0.05)%320; ctx.fillRect(x,150+(i*20)%200,30,2); }
 // player
 ctx.fillStyle='#ffdbac'; ctx.fillRect(145,85,22,14); ctx.fillStyle='#8a5cff'; ctx.fillRect(135,99,42,18); ctx.fillStyle='#1a1a1a'; ctx.fillRect(143,75,26,10);
 // rod
 let rodX=165, bobX=160+Math.sin(Date.now()*0.002)*(state=='idle'?0:3), bobY= state=='idle'? 115 : 160+Math.random()*2;
 if(state!='idle') bobY=170+(state=='bite'?Math.sin(Date.now()*0.02)*8:0);
 ctx.strokeStyle='#8B5E3C'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(rodX+15,100); ctx.lineTo(rodX+5,85); ctx.stroke();
 if(state!='idle'){ ctx.strokeStyle='#ffffffaa'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(rodX+5,85); ctx.lineTo(bobX,bobY); ctx.stroke(); ctx.fillStyle=state=='bite'?(Math.floor(Date.now()/100)%2?'#ff0000':'#fff'):'#ffcc00'; ctx.fillRect(bobX-5,bobY-6,10,12); ctx.strokeStyle='#ffffff33'; ctx.beginPath(); ctx.arc(bobX,bobY,12+Math.sin(Date.now()*0.005)*4,0,Math.PI*2); ctx.stroke(); if(state=='reeling'&&currentFish){ ctx.font='24px serif'; ctx.fillText(currentFish.emoji,bobX-12,bobY+45); } }
 // info
 ctx.fillStyle='#fff'; ctx.font='6px "Press Start 2P"'; ctx.fillText((isNight?'🌙 MALEM':'☀️ SIANG')+' | '+state.toUpperCase(),8,125);
 if(bossReady){ ctx.fillStyle='#ff0000'; ctx.fillRect(0,140,320,12); ctx.fillStyle='#fff'; ctx.fillText('🐊 BOSS MUNCUL! SIAP-SIAP!',40,148); }
}

function cast(){
 if(state!='idle'||inv.length>=bagSize){ if(inv.length>=bagSize) log('Tas penuh! Jual dulu Beben!'); return; }
 state='waiting'; log('⏳ Nunggu... got Bekasi bau tapi ikan banyak...');
 let wait=1500+Math.random()*3000; setTimeout(()=>{
  if(state!='waiting') return;
  let pool=fishTypes.filter(f=>{ if(f.nightOnly&&!(time>0.7||time<0.2)&&!hasLight) return false; return true; });
  let r=Math.random()*(baitLv==4?1.3:1); let acc=0, chosen=pool[0]; for(let f of pool){ acc+=f.rare; if(r<acc){ chosen=f; break; } }
  if(bossReady) chosen=bossFish;
  currentFish=chosen; state='bite'; document.getElementById('bars').style.display='block'; document.getElementById('fishName').innerText=chosen.emoji+' '+chosen.name; reelPower=20; log(`🐟 GIGIT! ${chosen.emoji} ${chosen.name}! TAP CEPET DI ZONA KUNING!`); draw();
  setTimeout(()=>{ if(state=='bite'){ state='idle'; document.getElementById('bars').style.display='none'; log('💨 Lepas! Telat Beben!'); currentFish=null; } },2500);
 },wait);
}

let tapping=false;
function startReel(){ if(state!='bite') return; state='reeling'; tapping=true; reelDir=1;
 reelInterval=setInterval(()=>{
  if(tapping){ reelPower+=rods[rodLv-1].speed* (1.5 + Math.random()*1.5); } else { reelPower-=0.8; }
  if(reelPower<0) reelPower=0; if(reelPower>100) reelPower=100;
  document.getElementById('fill').style.width=reelPower+'%'; document.getElementById('powerTxt').innerText=Math.floor(reelPower)+'%';
  if(reelPower>=100){ winFish(); }
  if(reelPower<=0 && state=='reeling'){ loseFish(); }
 },50);
}

function winFish(){
 clearInterval(reelInterval); let f=currentFish; if(f.boss){ bossReady=false; document.getElementById('bossBtn').disabled=true; document.getElementById('bossBtn').innerText='🐊 BOSS GOT (Rp50k)'; }
 inv.push(f); totalFish++; money+=0; updateUI(); log(f.boss?`🎉🎉 GILA! NGALAHIN ${f.name}! Rp${f.price}! LEGEND BEKASI!`:`✅ Dapet ${f.emoji} ${f.name}! Rp${f.price}`); if(f.legend||f.boss){ canvas.style.filter='brightness(1.6) contrast(1.3)'; setTimeout(()=>canvas.style.filter='',600); }
 state='idle'; document.getElementById('bars').style.display='none'; currentFish=null; if(totalFish%10==0){ time+=0.15; if(time>1) time=0; } draw();
}

function loseFish(){ clearInterval(reelInterval); state='idle'; document.getElementById('bars').style.display='none'; log('💨 Lepas! Pancing kurang kuat / tap kurang cepet!'); currentFish=null; }

function log(t){ document.getElementById('log').innerText=t; }

function updateUI(){
 document.getElementById('inv').innerHTML=inv.length? inv.map(f=>`<div class="f">${f.emoji}</div>`).join('') : 'Kosong - lempar lagi!';
 let total=inv.reduce((s,f)=>s+f.price,0); document.getElementById('sellVal').innerText=total; document.getElementById('money').innerText=money; document.getElementById('lvl').innerText=rodLv; document.getElementById('rodName').innerText=rods[rodLv-1].name; document.getElementById('rodSpeed').innerText=rods[rodLv-1].speed+'x'; document.getElementById('bag').innerText=bagSize; document.getElementById('baitName').innerText=baits[baitLv-1]; document.getElementById('upRod').innerText= rodLv<4? `UPGRADE Rp${rods[rodLv].price}` : 'MAX'; document.getElementById('upRod').disabled=rodLv>=4||money<rods[rodLv]?.price; document.getElementById('bossBtn').disabled=money<50000||bossReady; document.getElementById('lightStatus').innerText=hasLight?'ON - bisa mancing malem':'OFF';
}

document.getElementById('castBtn').addEventListener('touchstart',e=>{e.preventDefault(); if(state=='idle') cast(); else if(state=='bite') startReel();});
document.getElementById('castBtn').addEventListener('mousedown',()=>{ if(state=='idle') cast(); else if(state=='bite') startReel();});
canvas.addEventListener('touchstart',e=>{e.preventDefault(); if(state=='idle') cast(); else if(state=='bite'){ tapping=true; }});
canvas.addEventListener('touchend',()=>tapping=false);
canvas.addEventListener('mousedown',()=>{ if(state=='bite') tapping=true; });
canvas.addEventListener('mouseup',()=>tapping=false);
document.addEventListener('keydown',e=>{ if(e.code=='Space'){ if(state=='idle') cast(); tapping=true; }});
document.addEventListener('keyup',e=>{ if(e.code=='Space') tapping=false; });

document.getElementById('sellBtn').onclick=()=>{ let total=inv.reduce((s,f)=>s+f.price,0); if(!total) return; money+=total; inv=[]; updateUI(); log(`💰 Jual! +Rp${total} Total: Rp${money}`); };
document.getElementById('upRod').onclick=()=>{ if(rodLv<4&&money>=rods[rodLv].price){ money-=rods[rodLv].price; rodLv++; updateUI(); log(`🎣 Upgrade! Sekarang ${rods[rodLv-1].name}!`); }};
document.getElementById('upBait').onclick=()=>{ if(money>=5000&&baitLv<4){ money-=5000; baitLv++; updateUI(); log(`🪱 Umpan baru: ${baits[baitLv-1]}! Ikan gede lebih suka!`); } else if(baitLv>=4){ baitLv=1; updateUI(); } else log('Duit kurang Beben!'); };
document.getElementById('upLight').onclick=()=>{ if(!hasLight&&money>=20000){ money-=20000; hasLight=true; updateUI(); log('💡 Senter beli! Sekarang bisa mancing malem dapet ikan hantu!'); } };
document.getElementById('upBag').onclick=()=>{ if(money>=10000){ money-=10000; bagSize+=5; updateUI(); log(`📦 Tas gede! Sekarang muat ${bagSize} ikan!`); } };
document.getElementById('bossBtn').onclick=()=>{ if(money>=50000){ money-=50000; bossReady=true; updateUI(); log('🐊 MEMANGGIL BUAYA GOT! SIAP-SIAP BEBEN! LEMPAR SEKARANG!'); draw(); } };
setInterval(()=>{ time+=0.0005; if(time>1) time=0; draw(); },50);
updateUI(); (function loop(){ draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
