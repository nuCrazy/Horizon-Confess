<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Love - Premium</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Fraunces:opsz,wght@9..144,800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0a0a0f;min-height:100vh;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:-3;background:radial-gradient(600px at 20% 10%,#ff5a8a22,transparent),radial-gradient(800px at 80% 90%,#8a5cff22,transparent),radial-gradient(500px at 50% 50%,#ff8fa322,transparent),#0a0a0f}
.orb{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(80px);z-index:-2;animation:float 8s ease-in-out infinite}
.orb1{background:linear-gradient(180deg,#ff5a8a,#b06cff);top:-100px;left:-100px;opacity:.5}
.orb2{background:linear-gradient(180deg,#8a5cff,#00d4ff);bottom:-100px;right:-100px;opacity:.4;animation-delay:-4s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.heart-f{position:absolute;animation:fall linear forwards;opacity:.6}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0deg) scale(.8);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(110vh) rotate(720deg) scale(1.2);opacity:0}}

.top{width:100%;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:18px 16px}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#ff5a8a,#8a5cff);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 8px 20px #ff5a8a55}
.brand{font-weight:800;color:#fff;letter-spacing:-.5px}.brand span{background:linear-gradient(90deg,#ff5a8a,#8a5cff,#ff8fa3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:grad 3s linear infinite}
@keyframes grad{0%{background-position:0%}100%{background-position:200%}}

.wrap{max-width:520px;width:100%;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;padding:14px 10px 6px}
.hero h1{font-family:'Fraunces',serif;font-size:42px;line-height:.85;letter-spacing:-1.5px;color:#fff}
.hero h1 span{background:linear-gradient(90deg,#ff5a8a,#8a5cff,#ffd1dc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#ffffff66;font-size:13px;margin-top:10px;letter-spacing:.3px}

.card{background:linear-gradient(180deg,#ffffff0f,#ffffff08);backdrop-filter:blur(24px) saturate(1.5);border:1px solid #ffffff18;border-radius:28px;padding:22px;margin-top:18px;box-shadow:0 20px 60px #00000080, inset 0 1px 0 #ffffff22;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ff5a8a88,transparent)}
.label{font-size:11px;font-weight:800;letter-spacing:1px;color:#ffffff55;margin-top:16px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.inp{width:100%;padding:15px 16px;border:1.5px solid #ffffff15;background:#ffffff08;border-radius:16px;font-size:15px;font-weight:600;color:#fff;outline:none;transition:.2s}
.inp::placeholder{color:#ffffff33}
.inp:focus{border-color:#ff5a8a88;background:#ffffff0f;box-shadow:0 0 0 4px #ff5a8a18}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn{width:100%;margin-top:20px;padding:18px;background:linear-gradient(100deg,#ff5a8a,#8a5cff);border:none;border-radius:18px;font-weight:800;font-size:16px;color:#fff;cursor:pointer;box-shadow:0 10px 30px #ff5a8a55, 0 0 0 1px #ffffff22 inset;position:relative;overflow:hidden;transition:.15s}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent,#ffffff30,transparent);transform:translateX(-100%);transition:.6s}
.btn:hover::after{transform:translateX(100%)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6}

.result{margin-top:22px;display:none}
.circle-wrap{position:relative;width:200px;height:200px;margin:0 auto}
.circle{width:100%;height:100%;border-radius:50%;background:conic-gradient(from 0deg,#ff5a8a,#8a5cff,#ff5a8a);padding:4px;animation:spin 4s linear infinite;box-shadow:0 0 40px #ff5a8a44}
@keyframes spin{to{transform:rotate(360deg)}}
.inner{width:100%;height:100%;border-radius:50%;background:#0f0f13;display:grid;place-items:center;border:1px solid #ffffff11}
.pct{font-family:'Fraunces',serif;font-size:62px;font-weight:900;background:linear-gradient(180deg,#fff,#ffffff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.confetti{position:absolute;inset:0;pointer-events:none}

.bar{width:100%;height:16px;background:#ffffff10;border:1px solid #ffffff15;border-radius:99px;overflow:hidden;margin-top:20px;position:relative}
.fill{height:100%;background:linear-gradient(90deg,#ff5a8a,#8a5cff,#ffd1dc);width:0%;transition:width 1.8s cubic-bezier(.17,.67,.12,1);box-shadow:0 0 20px #ff5a8a88;position:relative}
.fill::after{content:'';position:absolute;top:0;bottom:0;right:0;width:40px;background:linear-gradient(90deg,transparent,#ffffff88);filter:blur(6px);animation:shine 1.5s ease-in-out infinite}
@keyframes shine{0%,100%{opacity:0}50%{opacity:1}}

.msg{margin-top:16px;padding:16px;background:linear-gradient(180deg,#ffffff0f,#ffffff05);border:1px solid #ffffff12;border-radius:18px;color:#ffffffcc;font-weight:600;font-size:14px;line-height:1.6;backdrop-filter:blur(12px)}
.tags{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tg{padding:7px 12px;border-radius:99px;background:#ffffff10;border:1px solid #ffffff15;color:#ffffff88;font-size:11px;font-weight:700}

.actions{display:flex;gap:8px;margin-top:14px}
.act{flex:1;padding:12px;border-radius:99px;border:1px solid #ffffff15;background:#ffffff08;color:#fff;font-weight:700;font-size:13px;cursor:pointer;backdrop-filter:blur(10px)}
.act.primary{background:#fff;color:#111}
</style>
</head>
<body>
<div class="bg"></div>
<div class="orb orb1"></div><div class="orb orb2"></div>
<div class="hearts" id="hearts"></div>

<div class="top">
<div style="display:flex;gap:10px;align-items:center"><div class="logo">H</div><div class="brand">HORIZON <span>LOVE</span></div></div>
<div style="background:#ffffff10;border:1px solid #ffffff15;padding:7px 12px;border-radius:99px;font-size:11px;font-weight:700;color:#ffffff88;backdrop-filter:blur(10px)">✨ PREMIUM EDITION</div>
</div>

<div class="wrap">
<div class="hero">
<h1>Cek Jodoh<br><span>Sekampus?</span></h1>
<div class="sub">Efek cinta realtime • Ketik bebas • Viral mode</div>
</div>

<div class="card">
<div class="row">
<div><div class="label">💁 NAMA KAMU</div><input id="n1" class="inp" placeholder="Beben"></div>
<div><div class="label">😍 NAMA DIA</div><input id="n2" class="inp" placeholder="Cantika"></div>
</div>
<div class="row">
<div><div class="label">🎓 JURUSAN KAMU</div><input id="j1" class="inp" placeholder="Teknik Informatika"></div>
<div><div class="label">🎓 JURUSAN DIA</div><input id="j2" class="inp" placeholder="Ilmu Komunikasi"></div>
</div>
<div style="margin-top:10px;color:#ffffff44;font-size:11px">💡 Bisa ketik jurusan apapun! Ex: DKV, Manajemen, Psikologi, Farmasi...</div>
<button class="btn" id="btn" onclick="hitung()">💘 HITUNG KECOCOKAN SEKARANG</button>

<div class="result" id="res">
<div class="circle-wrap">
<div class="circle"><div class="inner"><div><div class="pct" id="pct">0%</div><div style="font-size:22px;margin-top:-4px">💖</div></div></div></div>
<canvas class="confetti" id="conf"></canvas>
</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="msg" id="msg"></div>
<div class="tags" id="tags"></div>
<div class="actions">
<button class="act primary" onclick="share()">📤 Share WA</button>
<button class="act" onclick="reset()">🔄 Ulangi</button>
<button class="act" onclick="capture()">📸 Save</button>
</div>
</div>
</div>

<div style="text-align:center;color:#ffffff22;font-size:11px;margin-top:18px">Horizon Kuningan • Dibuat dengan 💘 + ✨</div>
</div>

<script>
function heartsRain(){
 let c=document.getElementById('hearts');
 setInterval(()=>{
  let h=document.createElement('div');h.className='heart-f';h.innerText=['💖','💘','💝','✨','💕'][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+'vw';h.style.fontSize=(12+Math.random()*18)+'px';h.style.animationDuration=(4+Math.random()*4)+'s';
  c.appendChild(h);setTimeout(()=>h.remove(),8000);
 },250);
}
heartsRain();

function jurusanScore(j1,j2){
 j1=j1.toLowerCase();j2=j2.toLowerCase();if(!j1||!j2)return 70;
 if(j1===j2)return 93;
 if((j1.includes('informatika')&&j2.includes('komunikasi'))||(j2.includes('informatika')&&j1.includes('komunikasi')))return 96;
 if((j1.includes('dkv')&&j2.includes('informatika'))||(j2.includes('dkv')&&j1.includes('informatika')))return 91;
 if(j1.includes('manajemen')&&j2.includes('manajemen'))return 88;
 return 62 + (j1.length+j2.length)%23;
}

function confettiBoom(){
 let canvas=document.getElementById('conf');let ctx=canvas.getContext('2d');canvas.width=200;canvas.height=200;
 let parts=[];for(let i=0;i<80;i++)parts.push({x:100,y:100,vx:(Math.random()-0.5)*12,vy:(Math.random()-0.5)*12-4,r:Math.random()*6+2,c:`hsl(${320+Math.random()*40},100%,70%)`,a:1});
 let anim=()=>{
  ctx.clearRect(0,0,200,200);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.a-=0.015;ctx.globalAlpha=p.a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
  if(parts[0].a>0)requestAnimationFrame(anim);
 };anim();
}

function hitung(){
 let n1=document.getElementById('n1').value.trim(),n2=document.getElementById('n2').value.trim();
 let j1=document.getElementById('j1').value.trim()||'Teknik Informatika',j2=document.getElementById('j2').value.trim()||'Ilmu Komunikasi';
 if(n1.length<2||n2.length<2)return alert('Isi nama dulu Beben! 💘');
 let btn=document.getElementById('btn');btn.disabled=true;btn.innerText='🔮 Menghitung takdir...';
 let base=(n1+n2+j1+j2).toLowerCase().split('').reduce((a,c)=>a+c.charCodeAt(0),0);
 let fac=jurusanScore(j1,j2);
 let score=Math.min(99,Math.max(12, fac + (base%18)-4));
 if(n1.toLowerCase()===n2.toLowerCase())score=99;
 if(n1.toLowerCase().includes('beben')||n2.toLowerCase().includes('beben'))score=Math.min(99,score+7);

 document.getElementById('res').style.display='block';
 let pctEl=document.getElementById('pct'),fill=document.getElementById('fill');
 let cur=0;let itv=setInterval(()=>{
  cur+=1;if(cur>=score){cur=score;clearInterval(itv);btn.disabled=false;btn.innerText='💘 HITUNG KECOCOKAN SEKARANG';if(score>=85)confettiBoom();}
  pctEl.innerText=cur+'%';fill.style.width=cur+'%';
 },18);

 let txt='';
 if(score>=96)txt=`🔥 ANJAY! ${n1} & ${n2} JODOH ALAM SEMESTA! ${j1} × ${j2} combo langka se-Horizon! Nikah kapan?`;
 else if(score>=88)txt=`💖 GILA COCOK! ${n1} (${j1}) & ${n2} (${j2}) chemistry nya meledak! Anak ${j2} emang jodohnya anak ${j1}!`;
 else if(score>=72)txt=`😍 Lumayan! ${n1} & ${n2} tinggal usaha dikit. Traktir 2x di kantin, auto jadian!`;
 else if(score>=50)txt=`🤔 50:50 nih ${n1}. Beda jurusan ${j1} vs ${j2} bikin beda jadwal, tapi cinta bisa ngalahin SKS!`;
 else txt=`😅 Waduh ${n1}, ${j1} × ${j2} beda frekuensi kayak WiFi & Bluetooth, tapi kalo udah cinta mah gas aja!`;
 document.getElementById('msg').innerText=txt;
 document.getElementById('tags').innerHTML=`<div class="tg">${j1}</div><div class="tg">${j2}</div><div class="tg">${fac}% chemistry</div><div class="tg">ID: ${base.toString(36).toUpperCase()}</div>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function share(){
 let n1=document.getElementById('n1').value||'A',n2=document.getElementById('n2').value||'B',pct=document.getElementById('pct').innerText;
 let j1=document.getElementById('j1').value,j2=document.getElementById('j2').value;
 let t=`💘 Horizon Love: ${n1} (${j1}) & ${n2} (${j2}) = ${pct} JODOH! Cek punya lu di ${location.href}`;
 window.open('https://wa.me/?text='+encodeURIComponent(t));
}
function reset(){document.getElementById('res').style.display='none';window.scrollTo({top:0,behavior:'smooth'});}
function capture(){alert('Screenshot manual ya Beben! Tekan tombol power + volume (HP) biar bisa share ke story IG 😘');}
</script>
</body>
</html>
