<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Confess</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#fcf9ff}
.top{position:sticky;top:0;background:#fff;padding:12px 16px;display:flex;justify-content:space-between;border-bottom:1px solid #eee}
.wrap{max-width:600px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:20px;padding:16px;border:1px solid #eee;margin-top:12px}
textarea{width:100%;border:2px solid #eee;background:#fbf7ff;border-radius:12px;padding:12px;min-height:90px}
.tag{display:inline-block;padding:7px 12px;border-radius:99px;background:#f3e8ff;margin:3px;font-size:13px;cursor:pointer}.tag.on{background:#111;color:#fff}
.btn{width:100%;padding:14px;background:#111;color:#fff;border:none;border-radius:12px;font-weight:800;margin-top:10px}
.item{background:#fff;border:1px solid #eee;border-radius:16px;padding:12px;margin-bottom:8px}
</style>
</head>
<body>
<div class="top"><b>HORIZON CONFESS</b><span id="cnt" style="background:#111;color:#fff;padding:5px 10px;border-radius:99px;font-size:11px">0 LIVE</span></div>
<div class="wrap">
<div class="card">
<textarea id="txt" placeholder="Tulis curhatan lu..."></textarea>
<div style="margin-top:8px"><div class="tag on" data-t="crush">👀 Crush</div><div class="tag" data-t="galau">💔 Galau</div><div class="tag" data-t="bucin">😍 Bucin</div><div class="tag" data-t="roasting">🔥 Roasting</div><div class="tag" data-t="random">🤣 Random</div></div>
<input id="to" style="width:100%;margin-top:8px;padding:10px;border:2px solid #eee;border-radius:10px" placeholder="Untuk siapa?">
<button class="btn" onclick="kirim()">🚀 KIRIM - MUNCUL DI SEMUA HP</button>
<p id="st" style="text-align:center;font-size:11px;color:#888;margin-top:8px">Menghubungkan...</p>
</div>
<div id="feed" style="margin-top:12px"></div>
</div>
<script>
let cur='crush';let all=[];
let BIN="b1a2c3d4-e5f6-7890-abcd-ef1234567890"; // GANTI ID LU DISINI KALO PUNYA
let API=`https://api.jsonstorage.net/v1/json/${BIN}`;
document.querySelectorAll('.tag').forEach(e=>e.onclick=()=>{document.querySelectorAll('.tag').forEach(x=>x.classList.remove('on'));e.classList.add('on');cur=e.dataset.t;});

async function load(){
 try{
  let r=await fetch(API);
  if(!r.ok) throw '404';
  let j=await r.json(); all=j.confess||[];
  document.getElementById('cnt').innerText=all.length+' LIVE';
  document.getElementById('st').innerText='🟢 LIVE - temen kirim, 3 detik muncul di HP lu!';
  render();
 }catch(e){
  // kalo bin belum ada, bikin otomatis
  try{
   let r=await fetch('https://api.jsonstorage.net/v1/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({confess:[{t:'Halo Horizon! Ini confess pertama realtime!',tag:'random',to:'Semua',time:'baru saja'}]})});
   let j=await r.json(); BIN=j.id||j.uri?.split('/').pop(); API=`https://api.jsonstorage.net/v1/json/${BIN}`;
   localStorage.setItem('h_bin',BIN); load();
  }catch(err){document.getElementById('st').innerText='Gagal konek: '+err}
 }
}
function render(){
 let f=document.getElementById('feed');f.innerHTML='';
 [...all].reverse().forEach(d=>{f.innerHTML+=`<div class="item"><b>#${d.tag}</b> <span style="float:right;font-size:11px;color:#aaa">${d.time}</span><div style="font-size:12px;color:#777">Untuk: ${d.to}</div><div style="margin-top:6px">${d.t}</div></div>`});
}
async function kirim(){
 let t=document.getElementById('txt').value.trim();let to=document.getElementById('to').value.trim()||'Semua';
 if(t.length<4)return alert('Tulis dulu!');
 document.getElementById('st').innerText='Mengirim...';
 try{
  let r=await fetch(API);let j=await r.json();let arr=j.confess||[];
  arr.push({t:t,tag:cur,to:to,time:'baru saja'});
  await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({confess:arr})});
  document.getElementById('txt').value=''; load();
 }catch(e){alert('Gagal: '+e)}
}
let saved=localStorage.getItem('h_bin');if(saved){BIN=saved;API=`https://api.jsonstorage.net/v1/json/${BIN}`;}
load();setInterval(load,3000);
</script>
</body>
</html>
