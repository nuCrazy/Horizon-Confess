<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Love Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#fff0f5;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.top{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#ff8fa3,#b06cff);display:grid;place-items:center;color:#fff;font-weight:800}
.brand{font-weight:800}.brand span{background:linear-gradient(90deg,#ff5a8a,#8a5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.wrap{max-width:500px;width:100%}
.hero{text-align:center;padding:18px 10px}
.hero h1{font-family:'Fraunces',serif;font-size:36px;line-height:.9;letter-spacing:-1px}.hero h1 span{background:linear-gradient(90deg,#ff5a8a,#8a5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#fff;border:2px solid #111;border-radius:24px;padding:20px;margin-top:14px;box-shadow:8px 8px 0 #111}
label{font-weight:800;font-size:13px;display:block;margin-top:14px;margin-bottom:6px}
.inp{width:100%;padding:14px 16px;border:2px solid #111;border-radius:14px;font-size:15px;font-weight:600;outline:none;background:#fff}
.inp:focus{border-color:#b06cff;box-shadow:0 0 0 3px #b06cff30}
.select{width:100%;padding:14px 16px;border:2px solid #111;border-radius:14px;font-size:15px;font-weight:600;background:#fff}
.btn{width:100%;margin-top:18px;padding:16px;background:#111;color:#fff;border:none;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 6px 0 #ff8fa3;transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #ff8fa3}
.result{margin-top:20px;text-align:center;display:none}
.circle{width:180px;height:180px;border-radius:50%;border:6px solid #111;margin:0 auto;display:grid;place-items:center;background:#fff;box-shadow:8px 8px 0 #111;position:relative}
.pct{font-family:'Fraunces',serif;font-size:56px;font-weight:800;line-height:1}
.bar{width:100%;height:14px;background:#f0f0f0;border:2px solid #111;border-radius:99px;overflow:hidden;margin-top:16px}
.fill{height:100%;background:linear-gradient(90deg,#ff5a8a,#8a5cff);width:0%;transition:width 1.5s cubic-bezier(.17,.67,.12,.99)}
.msg{margin-top:16px;padding:14px;background:#fffbe6;border:2px dashed #111;border-radius:14px;font-weight:700;font-size:14px;line-height:1.5}
.tag{display:inline-block;padding:6px 12px;border-radius:99px;background:#111;color:#fff;font-size:11px;font-weight:700;margin-top:8px}
.heart{font-size:24px;animation:beat 0.8s infinite}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;gap:10px;align-items:center"><div class="logo">H</div><div class="brand">HORIZON <span>LOVE</span></div></div>
<div style="background:#111;color:#fff;padding:6px 12px;border-radius:99px;font-size:11px;font-weight:700">💘 KALKULATOR CINTA</div>
</div>

<div class="wrap">
<div class="hero">
<h1>Cek Jodoh<br><span>Sekampus?</span></h1>
<p style="color:#777;font-size:13px;margin-top:8px">Masukin nama + fakultas, liat kecocokan!</p>
</div>

<div class="card">
<label>💁 Nama Kamu</label>
<input id="n1" class="inp" placeholder="Ex: Beben">
<select id="f1" class="select">
<option value="FTI">FTI - Teknik Informatika</option>
<option value="FEB">FEB - Ekonomi Bisnis</option>
<option value="FIKOM">FIKOM - Ilmu Komunikasi</option>
<option value="FT">FT - Teknik</option>
<option value="FH">FH - Hukum</option>
<option value="FKIP">FKIP - Keguruan</option>
<option value="FISIP">FISIP</option>
<option value="FK">FK - Kedokteran</option>
</select>

<label>😍 Nama Crush / Gebetan</label>
<input id="n2" class="inp" placeholder="Ex: Cantika">
<select id="f2" class="select">
<option value="FTI">FTI - Teknik Informatika</option>
<option value="FEB">FEB - Ekonomi Bisnis</option>
<option value="FIKOM" selected>FIKOM - Ilmu Komunikasi</option>
<option value="FT">FT - Teknik</option>
<option value="FH">FH - Hukum</option>
<option value="FKIP">FKIP - Keguruan</option>
<option value="FISIP">FISIP</option>
<option value="FK">FK - Kedokteran</option>
</select>

<button class="btn" onclick="hitung()">💘 HITUNG KECocOKAN!</button>

<div class="result" id="res">
<div class="circle"><div><div class="pct" id="pct">0%</div><div class="heart">💖</div></div></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="msg" id="msg"></div>
<div style="margin-top:12px">
<button onclick="share()" style="padding:10px 16px;border-radius:99px;border:2px solid #111;background:#fff;font-weight:700;cursor:pointer">📤 Share ke WA</button>
<button onclick="reset()" style="padding:10px 16px;border-radius:99px;border:2px solid #111;background:#ff8fa3;color:#fff;font-weight:700;cursor:pointer;margin-left:6px">🔄 Coba Lagi</button>
</div>
</div>
</div>

<p style="text-align:center;color:#aaa;font-size:11px;margin-top:16px">Made for Horizon Kuningan • 100% fun, jangan baper ya!</p>
</div>

<script>
const compat={
 'FTI-FTI':10,'FTI-FEB':75,'FTI-FIKOM':92,'FTI-FT':80,'FTI-FH':60,'FTI-FKIP':70,'FTI-FISIP':78,'FTI-FK':65,
 'FEB-FEB':85,'FEB-FIKOM':88,'FEB-FT':70,'FEB-FH':82,'FEB-FKIP':75,'FEB-FISIP':80,'FEB-FK':68,
 'FIKOM-FIKOM':90,'FIKOM-FT':72,'FIKOM-FH':78,'FIKOM-FKIP':85,'FIKOM-FISIP':95,'FIKOM-FK':70,
};

function getCompat(f1,f2){
 let k1=f1+'-'+f2, k2=f2+'-'+f1;
 if(compat[k1]!=null) return compat[k1];
 if(compat[k2]!=null) return compat[k2];
 return 70;
}

function hitung(){
 let n1=document.getElementById('n1').value.trim();
 let n2=document.getElementById('n2').value.trim();
 let f1=document.getElementById('f1').value;
 let f2=document.getElementById('f2').value;
 if(n1.length<2||n2.length<2) return alert('Isi nama dulu Beben! Minimal 2 huruf');

 // hitung love - deterministic biar kalo nama sama hasilnya sama (biar bisa share)
 let base = (n1.toLowerCase()+n2.toLowerCase()).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
 let facultyBonus = getCompat(f1,f2);
 let randomFactor = (base % 30) - 10; // -10 sampai +20
 let score = Math.min(99, Math.max(12, facultyBonus + randomFactor + (base % 15)));

 // easter egg
 if(n1.toLowerCase()===n2.toLowerCase()) score=99;
 if((n1.toLowerCase().includes('beben')||n2.toLowerCase().includes('beben'))) score=Math.min(99,score+8);

 let res=document.getElementById('res');res.style.display='block';
 let pctEl=document.getElementById('pct');let fill=document.getElementById('fill');
 pctEl.innerText='0%';fill.style.width='0%';

 setTimeout(()=>{
  let cur=0;let itv=setInterval(()=>{
   cur+=2;if(cur>=score){cur=score;clearInterval(itv);}
   pctEl.innerText=cur+'%';fill.style.width=cur+'%';
  },20);
 },100);

 let msg='';
 if(score>=95) msg=`🔥 GILA! ${n1} & ${n2} JODOH SEJATI! Fakultas ${f1} x ${f2} itu combo langka! Buruan tembak sebelum diambil orang!`;
 else if(score>=85) msg=`💖 ${n1}, peluang lu sama ${n2} GEDE BANGET! ${f1} & ${f2} itu klop! Anak ${f2} emang suka disayang anak ${f1}!`;
 else if(score>=70) msg=`😍 Lumayan! ${n1} & ${n2} cocok! Cuma butuh effort dikit. Traktir kantin teknik 2x seminggu, auto jadian!`;
 else if(score>=50) msg=`🤔 Hmm ${n1}, sama ${n2} masih 50:50. Beda fakultas ${f1} vs ${f2} bikin beda jadwal. Tapi cinta bisa ngalahin SKS!`;
 else msg=`😅 Waduh ${n1}, sama ${n2} agak berat. ${f1} x ${f2} itu kayak Windows x MacOS, beda sistem! Tapi siapa tau lu suka tantangan?`;

 document.getElementById('msg').innerHTML=`${msg}<br><div class="tag">${f1} × ${f2} = ${facultyBonus}% chemistry</div>`;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function share(){
 let n1=document.getElementById('n1').value;let n2=document.getElementById('n2').value;let pct=document.getElementById('pct').innerText;
 let txt=`💘 Horizon Love Calculator: ${n1} & ${n2} = ${pct} jodoh! Cek jodoh lu di https://horizon-confess.vercel.app/`;
 window.open('https://wa.me/?text='+encodeURIComponent(txt));
}
function reset(){
 document.getElementById('res').style.display='none';
 document.getElementById('n1').value='';document.getElementById('n2').value='';
 document.getElementById('n1').focus();
}
</script>
</body>
</html>
