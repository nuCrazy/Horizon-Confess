<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Roulette</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f0f13;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.top{width:100%;max-width:600px;display:flex;justify-content:space-between;align-items:center;padding:12px 0}
.logo{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#ff8fa3,#b06cff);display:grid;place-items:center;font-weight:800}
.brand{font-weight:800;font-size:18px}.brand span{background:linear-gradient(90deg,#ff5a8a,#8a5cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.coins{background:#1c1c22;border:1px solid #2a2a33;padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px}
.wrap{max-width:600px;width:100%;margin-top:10px}
.roulette-wrap{position:relative;width:320px;height:320px;margin:20px auto}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid #1c1c22;position:relative;overflow:hidden;transition:transform 4s cubic-bezier(0.17,0.67,0.12,0.99);box-shadow:0 0 0 4px #2a2a33, 0 20px 60px #00000080}
.seg{position:absolute;width:50%;height:50%;left:50%;top:0;transform-origin:0% 100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.pointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid #ff5a8a;z-index:10;filter:drop-shadow(0 4px 8px #000)}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;background:#111;border:4px solid #2a2a33;border-radius:50%;display:grid;place-items:center;font-weight:800;z-index:5;box-shadow:0 4px 20px #000}
.card{background:#1c1c22;border:1px solid #2a2a33;border-radius:20px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.bet{padding:14px;border-radius:14px;background:#252530;border:1.5px solid #2f2f40;text-align:center;font-weight:700;cursor:pointer;transition:.15s}
.bet.on{background:#fff;color:#111;border-color:#fff;transform:scale(1.02)}
.bet small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.btn{width:100%;margin-top:14px;padding:16px;background:linear-gradient(90deg,#ff5a8a,#8a5cff);border:none;border-radius:14px;font-weight:800;font-size:16px;color:#fff;cursor:pointer}
.btn:disabled{opacity:.5}
.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.h{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;gap:10px;align-items:center"><div class="logo">H</div><div class="brand">HORIZON <span>ROULETTE</span></div></div>
<div class="coins">💰 <span id="coins">1000</span></div>
</div>

<div class="wrap">
<div class="roulette-wrap">
<div class="pointer"></div>
<div class="wheel" id="wheel"></div>
<div class="center" id="result">H</div>
</div>

<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<b>Pilih Taruhan</b><span style="font-size:11px;background:#2a2a33;padding:6px 10px;border-radius:99px" id="status">Pilih & Spin!</span>
</div>
<div class="grid">
<div class="bet on" data-bet="red" onclick="pick(this)"><span style="color:#ff4d6a">🔴 MERAH</span><small>x2</small></div>
<div class="bet" data-bet="black" onclick="pick(this)"><span style="color:#aaa">⚫ HITAM</span><small>x2</small></div>
<div class="bet" data-bet="green" onclick="pick(this)"><span style="color:#00e676">🟢 HIJAU</span><small>x14</small></div>
<div class="bet" data-bet="gold" onclick="pick(this)"><span style="color:#ffd54f">🟡 GOLD</span><small>x7</small></div>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button style="flex:1;padding:12px;background:#252530;border:1px solid #2f2f40;border-radius:12px;color:#fff;font-weight:700" onclick="chip(-10)">-10</button>
<div style="flex:2;background:#111;border:1px solid #2a2a33;border-radius:12px;display:grid;place-items:center;font-weight:800" id="betAmount">100</div>
<button style="flex:1;padding:12px;background:#252530;border:1px solid #2f2f40;border-radius:12px;color:#fff;font-weight:700" onclick="chip(10)">+10</button>
<button style="flex:1;padding:12px;background:#252530;border:1px solid #2f2f40;border-radius:12px;color:#fff;font-weight:700" onclick="chip(100)">+100</button>
</div>
<button class="btn" id="spinBtn" onclick="spin()">🎰 SPIN ROULETTE!</button>
<div style="margin-top:12px;font-size:11px;color:#777;text-align:center">Riwayat:</div>
<div class="history" id="hist"></div>
</div>
</div>

<script>
const colors={red:'#ff4d6a',black:'#2a2a33',green:'#00e676',gold:'#ffd54f'};
const segments=[
 {c:'red',l:'Merah'},{c:'black',l:'Hitam'},{c:'red',l:'Merah'},{c:'black',l:'Hitam'},
 {c:'red',l:'Merah'},{c:'black',l:'Hitam'},{c:'gold',l:'GOLD'},{c:'black',l:'Hitam'},
 {c:'red',l:'Merah'},{c:'black',l:'Hitam'},{c:'red',l:'Merah'},{c:'black',l:'Hitam'},
 {c:'green',l:'HIJAU'},{c:'black',l:'Hitam'}
];
let coins=parseInt(localStorage.getItem('h_coins')||'1000');
let bet=100, picked='red', spinning=false, deg=0;
let hist=JSON.parse(localStorage.getItem('h_hist')||'[]');

function build(){
 let w=document.getElementById('wheel');w.innerHTML='';
 segments.forEach((s,i)=>{
  let el=document.createElement('div');el.className='seg';
  el.style.transform=`rotate(${i* (360/segments.length)}deg)`;
  el.style.background=colors[s.c];
  el.innerHTML=`<span style="transform:rotate(${90}deg) translate(30px)">${s.c==='green'?'💚':s.c==='gold'?'⭐':''}</span>`;
  w.appendChild(el);
 });
 document.getElementById('coins').innerText=coins;
 renderHist();
}
function pick(el){
 document.querySelectorAll('.bet').forEach(x=>x.classList.remove('on'));el.classList.add('on');picked=el.dataset.bet;
}
function chip(v){
 bet=Math.max(10,Math.min(coins,bet+v));document.getElementById('betAmount').innerText=bet;
}
function renderHist(){
 let h=document.getElementById('hist');h.innerHTML='';
 hist.slice(-12).reverse().forEach(c=>{
  h.innerHTML+=`<div class="h" style="background:${colors[c]}">${c==='red'?'R':c==='black'?'B':c==='green'?'G':'$'}</div>`;
 });
}
function spin(){
 if(spinning)return;if(bet>coins)return alert('Koin gak cukup Beben!');
 spinning=true;document.getElementById('spinBtn').disabled=true;document.getElementById('status').innerText='Muter...';
 let winIdx=Math.floor(Math.random()*segments.length);
 let extra=360*5 + (360 - winIdx*(360/segments.length) - (360/segments.length)/2);
 deg+=extra;
 document.getElementById('wheel').style.transform=`rotate(${deg}deg)`;
 setTimeout(()=>{
  let win=segments[winIdx];
  let res=document.getElementById('result');res.innerText=win.c[0].toUpperCase();res.style.background=colors[win.c];res.style.color=win.c==='black'?'#fff':'#111';
  hist.push(win.c);if(hist.length>20)hist.shift();
  localStorage.setItem('h_hist',JSON.stringify(hist));
  let winAmt=0;
  if(win.c===picked){
   if(win.c==='green')winAmt=bet*14;else if(win.c==='gold')winAmt=bet*7;else winAmt=bet*2;
   coins+=winAmt; document.getElementById('status').innerText=`🎉 MENANG ${winAmt}! ${win.l}`;
  }else{
   coins-=bet; document.getElementById('status').innerText=`😭 Kalah - ${win.l} keluar`;
  }
  localStorage.setItem('h_coins',coins);document.getElementById('coins').innerText=coins;renderHist();
  spinning=false;document.getElementById('spinBtn').disabled=false;
  if(coins<=0){coins=200;localStorage.setItem('h_coins',coins);alert('Bangkrut! Ita kasih 200 koin gratis 😘')}
 },4100);
}
build();
</script>
</body>
</html>
