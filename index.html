<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEBEN77 - SLOT SADAR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0f0f12;color:#fff;min-height:100vh;display:grid;place-items:center;padding:14px}
.box{width:100%;max-width:420px;background:linear-gradient(180deg,#1f1f27,#15151b);border:1.5px solid #ffffff18;border-radius:20px;padding:16px;box-shadow:0 24px 70px #000}
.top{display:flex;justify-content:space-between;align-items:center}
.brand b{font-size:15px}.brand b span{color:#ff4d4d}
.pill{background:#ffffff0e;border:1px solid #ffffff14;padding:6px 10px;border-radius:99px;font-size:11px;font-weight:800}
.reels{margin-top:14px;background:#0a0a0f;border:1.5px solid #ffffff14;border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.reel{aspect-ratio:1;background:#ffffff0e;border:1px solid #ffffff12;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:900}
.reel.win{border-color:#ff4d4d;background:#ff4d4d1a;transform:scale(1.06)}
.msg{margin-top:12px;background:#ff4d4d12;border:1px solid #ff4d4d33;border-radius:12px;padding:12px;text-align:center}
.msg h3{font-size:16px;color:#ff8a8a}.msg p{font-size:12px;color:#ffffff88;margin-top:4px;line-height:1.4}
.btn{width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;background:linear-gradient(100deg,#ff4d4d,#ff8a00);color:#fff;font-weight:900;font-size:14px;cursor:pointer}
.btn.sec{background:#ffffff10;color:#ffffff88}
.stats{margin-top:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:#ffffff06;border:1px solid #ffffff0e;border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:14px;color:#ffcc00}.stat span{font-size:9px;color:#ffffff55}
</style>
</head>
<body>
<div class="box">
<div class="top"><div class="brand"><b>BEBEN<span>77</span> - SLOT SADAR</b></div><div class="pill">💸 UDAH RUGI: <span id="rugi">0</span></div></div>

<div class="reels" id="reels"></div>

<div class="msg" id="msg"><h3 id="msgTitle">TAP SPIN BUAT DISINDIR</h3><p id="msgSub">Lihat kalo ini uang beneran, lu udah rugi berapa</p></div>

<div class="stats">
<div class="stat"><b id="sSpin">0</b><span>SPIN</span></div>
<div class="stat"><b id="sJam">0 jam</b><span>WAKTU HILANG</span></div>
<div class="stat"><b id="sUtang">0</b><span>FAKTA JUDOL</span></div>
</div>

<button class="btn" id="btn" onclick="spin()">SPIN - KENA ROAST 🔥</button>
<button class="btn sec" onclick="share()">SHARE KE TEMEN YANG KECANDUAN</button>
<p style="text-align:center;margin-top:10px;font-size:9px;color:#ffffff33">Ini parodi edukasi. Bukan judi. Dibikin biar kapok, bukan ketagihan.<br>Butuh bantuan? Hub 119 ext 8</p>
</div>

<script>
const ROASTS=[
 {t:"🃏 Scatter PHP", s:"3 scatter = harapan palsu. Kayak dijanjiin jackpot tapi yang dateng debt collector", rugi: 500000},
 {t:"💸 Auto Spin 50x", s:"Lu baru buang 1 jam nungguin animasi muter. Padahal bisa buat skripsi / tidur", rugi: 1000000},
 {t:"🤡 BIG WIN 10k", s:"Menang 10k setelah kalah 2 juta itu bukan menang, itu diskon rugi 99.5%", rugi: 2000000},
 {t:"🏦 Bonus Pinjol", s:"Selamat! Bonus free spin = bonus ditawarin pinjol bunga 30%", rugi: 1500000},
 {t:"📱 Getar HP", s:"HP lu getar bukan karena jackpot, tapi notif WA nagih utang", rugi: 800000},
 {t:"😵‍💫 Mahjong Way", s:"Way of... way to miskin. Mahjong asli buat fun, yang ini buat nguras tabungan", rugi: 2500000},
 {t:"🎰 Pragmatic Play?", s:"Pragmatic = penyedia game. Lu yang gak pragmatic kalo jual motor buat spin", rugi: 3000000},
];
let totalRugi=0, spins=0;
const EMOJIS=["💸","🤡","📉","🏦","😭","🕳️","💳"];

function render(){
 let h=''; for(let i=0;i<15;i++) h+=`<div class="reel" id="r${i}">${EMOJIS[Math.floor(Math.random()*EMOJIS.length)]}</div>`;
 document.getElementById('reels').innerHTML=h;
}
render();

function spin(){
 spins++; totalRugi+= Math.floor(Math.random()*500000)+200000;
 let pick = ROASTS[Math.floor(Math.random()*ROASTS.length)];
 document.getElementById('rugi').innerText = (totalRugi/1000000).toFixed(1)+'jt';
 document.getElementById('sSpin').innerText=spins;
 document.getElementById('sJam').innerText=(spins*1.2).toFixed(1)+' jam';
 document.getElementById('sUtang').innerText=spins+' fakta';
 
 // animasi
 let reels=document.querySelectorAll('.reel');
 reels.forEach((r,i)=>{ setTimeout(()=>{ r.innerText=EMOJIS[Math.floor(Math.random()*EMOJIS.length)]; r.classList.add('win'); setTimeout(()=>r.classList.remove('win'),400); }, i*60); });
 
 // suara roast
 try{ let ac=new (window.AudioContext||window.webkitAudioContext)(); let o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=200; o.type='sawtooth'; g.gain.value=0.15; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+0.5); o.stop(ac.currentTime+0.5);}catch(e){}
 if(navigator.vibrate) navigator.vibrate([40,20,40]);

 document.getElementById('msgTitle').innerText=pick.t;
 document.getElementById('msgSub').innerText=pick.s + ` (kalo asli rugi ~Rp ${pick.rugi.toLocaleString('id-ID')})`;

 if(spins>=5){
  document.getElementById('msgTitle').innerText="UDAH 5x SPIN MASIH BELUM KAPOK?";
  document.getElementById('msgSub').innerText=`Total kalo uang beneran: lu udah rugi Rp ${totalRugi.toLocaleString('id-ID')} dan buang ${(spins*1.2).toFixed(1)} jam. Mending traktir temen seblak.`;
 }
}

function share(){
 let txt=`Gua main BEBEN77 SLOT SADAR - abis ${spins}x spin, kalo ini judol beneran gua udah rugi Rp ${totalRugi.toLocaleString('id-ID')} 🤡\n\nCobain biar kapok judol: ${location.href}`;
 window.open('https://wa.me/?text='+encodeURIComponent(txt));
}
</script>
</body>
</html>
